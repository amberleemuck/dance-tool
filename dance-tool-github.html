    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0b10;
        --surface: #17131d;
        --surface-alt: #1f1929;
        --text: #f5efe8;
        --dim: #a49cae;
        --border: #2c2635;
        --accent: #ff4d2e;
        --volt: #ffd23f;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .fd { font-family: "Archivo", system-ui, sans-serif; letter-spacing: -0.01em; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      button:disabled { opacity: 0.35; cursor: default; }
      :focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      #app { display: flex; flex-direction: column; height: 100dvh; }
      .page { flex: 1; min-height: 0; position: relative; }
      .view { height: 100%; overflow-y: auto; width: 100%; max-width: 768px; margin: 0 auto; padding: 10px 12px 16px; }
      .view[hidden] { display: none; }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
      .dim { color: var(--dim); }
      .accent { color: var(--accent); }
      .volt { color: var(--volt); }

      /* ---------- buttons & fields ---------- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); padding: 7px 13px; font-size: 13px; font-weight: 600; background: var(--bg); }
      .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-family: "Archivo", system-ui, sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
      .btn-volt { background: var(--volt); border-color: var(--volt); color: #000; font-family: "Archivo", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .btn-outline-accent { border-color: var(--accent); color: var(--accent); font-family: "Archivo", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .seg { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: "Archivo", system-ui, sans-serif; border: 1px solid transparent; color: var(--dim); white-space: nowrap; }
      .seg[aria-pressed="true"] { background: var(--volt); color: #000; }
      .seg:not([aria-pressed="true"]) { border-color: var(--border); }
      .minchip { border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--dim); }
      .minchip[aria-pressed="true"] { background: var(--volt); border-color: var(--volt); color: #000; }
      .iconbtn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-alt); padding: 8px; }
      .field { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 7px 8px; font-size: 16px; line-height: normal; }
      select.field { appearance: auto; }
      .pairchip { display: inline-block; border: 1px solid var(--volt); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
      .bar { overflow: hidden; border-radius: 999px; background: var(--surface-alt); }
      .bar > i { display: block; height: 100%; background: var(--volt); border-radius: 999px; transition: width 0.2s linear; }
      svg.ic { flex: none; }

      /* ---------- bottom nav ---------- */
      #tabbar { border-top: 1px solid var(--border); background: rgba(13, 11, 16, 0.95); backdrop-filter: blur(8px); }
      #tabbar .inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 768px; margin: 0 auto; padding: 4px 8px max(6px, env(safe-area-inset-bottom)); }
      #tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 2px; border-radius: 8px; font-family: "Archivo", system-ui, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
      #tabbar button[aria-selected="true"] { color: var(--accent); }

      /* ---------- timer view (fits one phone screen) ---------- */

function storeGet(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (raw === null) return fallback;
    var v = JSON.parse(raw);
    return v === null || v === undefined ? fallback : v;
  } catch (e) { return fallback; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode etc. — state still works for the session */ }
}

/* --------------------------- catalog merge --------------------------- */
function effectiveCategories() {
  var baked = (DATA && DATA.customItems) || {};
  return DATA.categories.map(function (c) {
    var seen = {};
    var items = [];
    function push(it) {
      var k = String(it).toLowerCase();
      if (!seen[k]) { seen[k] = true; items.push(it); }
    }
    c.items.forEach(push);
    (baked[c.name] || []).forEach(push);
    (state.customItems[c.name] || []).forEach(push);
    return { name: c.name, items: items };
  }).concat((state.customCategories || []).filter(function (cc) {
    return !DATA.categories.some(function (c) { return c.name.toLowerCase() === String(cc.name).toLowerCase(); });
  }).map(function (cc) {
    var seen = {};
    var items = [];
    (state.customItems[cc.name] || []).forEach(function (it) {
      var k = String(it).toLowerCase();
      if (!seen[k]) { seen[k] = true; items.push(it); }
    });
    return { name: cc.name, items: items };
  }));
}
function addCustomCategory(name) {
  var cats = effectiveCategories();
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].name.toLowerCase() === name.toLowerCase()) return cats[i].name;
  }
  state.customCategories.push({ name: name });
  storeSet(LS_CATS, state.customCategories);
  return name;
}

  for (var i = 0; i < cats.length; i++) if (cats[i].name === category) cat = cats[i];
  if (!cat) return false;
  var lower = item.toLowerCase();
  for (var j = 0; j < cat.items.length; j++) if (cat.items[j].toLowerCase() === lower) return false;
  if (!state.customItems[category]) state.customItems[category] = [];
  state.customItems[category].push(item);
  storeSet(LS_ITEMS, state.customItems);
  return true;
}

/* ------------------------------ labs --------------------------------- */
function labSignature(lab) {
  return (lab.pairs || []).map(function (p) { return p.category + "" + p.item; }).join("|") + "#" + (lab.name || "");
}
function allLabs() {
  var out = [];
  var seen = {};
  state.bakedLabs.forEach(function (l) {
    var lab = { id: "baked-" + out.length, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: true };
    var sig = labSignature(lab);
    if (state.hiddenBaked.indexOf(sig) !== -1) return;
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  state.localLabs.forEach(function (l) {
    var lab = { id: l.id, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: false };
    var sig = labSignature(lab);
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  return out;
}
function pairsForLab(lab) {
  if (lab.pairs && lab.pairs.length > 0) return lab.pairs;
  return (lab.moves || []).map(function (item) {
    return { category: lab.source === "party" ? "Party steps" : "Lab", item: item };
  });
}
function labName(pairs) {
  return pairs.map(function (p) { return p.item ? p.item : "Random " + p.category; }).join(" · ") || "Lab";
}
/* The pairs a set of slots stands for right now: a chosen category with
   no item stays random (item ""); a slot with no category rolls a
   concrete category + item. */
function snapshotPairs(slots) {
  var categories = effectiveCategories();
  return slots.map(function (slot) {
    if (slot.category) return { category: slot.category, item: slot.item || "" };
    var cat = pickRandom(categories);
    if (!cat) return { category: "Freestyle", item: "Free choice" };
    return { category: cat.name, item: pickRandom(cat.items) || "Free choice" };
  });
}
/* Roll every random slot fresh for a session start — fixed picks stay,
   and a rolled item never repeats another item from its category. */
function resolveForSession(pairs) {
  var cats = effectiveCategories();
  var byName = {};
  cats.forEach(function (c) { byName[c.name] = c.items; });
  var used = {};
  pairs.forEach(function (p) {
    if (p.item) { if (!used[p.category]) used[p.category] = {}; used[p.category][p.item] = true; }
  });
  return pairs.map(function (p) {
    if (p.item) return { category: p.category, item: p.item };
    var all = byName[p.category] || [];
    if (!used[p.category]) used[p.category] = {};
    var open = all.filter(function (it) { return !used[p.category][it]; });
    var item = pickRandom(open.length ? open : all);
    if (item) used[p.category][item] = true;
    return { category: p.category, item: item || "Free choice" };
  });
}
function findLab(id) {
  var labs = allLabs();
  for (var i = 0; i < labs.length; i++) if (labs[i].id === id) return labs[i];
  return null;
}
function saveLocalLab(name, pairs, source) {
  var lab = { id: newId("lab"), name: name || labName(pairs), pairs: pairs, source: source || "" };
  state.localLabs.unshift(lab);
  storeSet(LS_LABS, state.localLabs);
  return lab;
}
function deleteLocalLab(id) {
  state.localLabs = state.localLabs.filter(function (l) { return l.id !== id; });
  storeSet(LS_LABS, state.localLabs);
}
function hideBakedLab(lab) {
  var sig = labSignature({ name: lab.name || "", pairs: pairsForLab(lab) });
  if (state.hiddenBaked.indexOf(sig) === -1) {
    state.hiddenBaked.push(sig);
    storeSet(LS_HIDDEN, state.hiddenBaked);
  }
}
function labInTimer(lab) {
  var name = lab.name || labName(pairsForLab(lab));
  return state.drills.some(function (d) { return d.name === name; });
}
function sendLabToTimer(lab) {
  var pairs = pairsForLab(lab);
  var name = lab.name || labName(pairs);
  if (state.drills.some(function (d) { return d.name === name; })) return false;
  state.drills.push({ id: newId("drill"), name: name, pairs: pairs.map(function (p) { return { category: p.category, item: p.item || "" }; }) });
  storeSet(LS_DRILLS, state.drills);
  queue.onDrillsChanged();
  return true;
}

/* ------------------------------ helpers ------------------------------ */
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtClock(totalSeconds) {
  var s = Math.max(0, Math.ceil(totalSeconds));
  var m = Math.floor(s / 60);
  var r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function fmtTimestamp(totalSeconds) {
  var s = Math.max(0, Math.round(totalSeconds));
  var m = Math.floor(s / 60);
  var r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function pickRandom(arr) {

}
function embedUrl(videoId, opts) {
  opts = opts || {};
  var params = "rel=0&modestbranding=1&playsinline=1";
  if (opts.autoplay) params += "&autoplay=1";
  if (opts.loop) params += "&loop=1&playlist=" + encodeURIComponent(videoId);

}
function watchUrl(videoId) { return "https://www.youtube.com/watch?v=" + videoId; }
function parseYouTubeId(input) {
  var t = String(input || "").trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
  var patterns = [/[?&]v=([A-Za-z0-9_-]{11})/, /youtu\.be\/([A-Za-z0-9_-]{11})/, /\/embed\/([A-Za-z0-9_-]{11})/, /\/shorts\/([A-Za-z0-9_-]{11})/];
  for (var i = 0; i < patterns.length; i++) {
    var m = t.match(patterns[i]);
    if (m) return m[1];
  }
  return null;
}
function parseTimestamp(input) {
  var t = String(input || "").trim().replace(/s$/i, "");
  if (!t) return null;
  if (/^\d+(\.\d+)?$/.test(t)) return Number(t);
  var parts = t.split(":").map(function (p) { return Number(p); });
  for (var i = 0; i < parts.length; i++) if (isNaN(parts[i]) || parts[i] < 0) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}

/* --------------------------- sound + wake ---------------------------- */
var audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { /* sound is a nicety */ }
}
function beep() {
  if (!audioCtx) return;
  try {
    var t0 = audioCtx.currentTime;
    [0, 0.28, 0.56].forEach(function (off) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.5, t0 + off + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.25);
    });
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  } catch (e) { /* visual state still advances */ }
}
var wakeLock = null;
var wakeWanted = false;
function setWake(on) {
  wakeWanted = on;
  try {
    if (on) {
      if (!wakeLock && navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (wl) {
          wakeLock = wl;
          wl.addEventListener("release", function () { wakeLock = null; });
          if (!wakeWanted) setWake(false);
        }).catch(function () { /* best effort */ });
      }
    } else if (wakeLock) {
      var wl = wakeLock; wakeLock = null;
      wl.release().catch(function () {});
    }
  } catch (e) { /* best effort */ }
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && wakeWanted && !wakeLock) setWake(true);
});

/* =====================================================================
   Slot pickers — one category + item pair per slot, shared by the Labs
   builder, the Timer quick-pick and the lab editor. Ports the Muse
   version's CategoryItemPicker + rollCombination exactly: fixed picks
   stay on re-roll, an item never repeats within one category in a set,
   and "+ Add item…" inside the item dropdown adds to that category.
   ===================================================================== */
var pickers = {}; // id -> {slots:[{uid,category,item}], addingUid, onSlotsChanged}
var slotUid = 0;
function newSlot(category, item) {
  slotUid += 1;
  return { uid: "slot-" + slotUid, category: category || "", item: item || "" };
}
function makePicker(id, slots, onSlotsChanged) {
  pickers[id] = { slots: slots, addingUid: null, addingCatUid: null, onSlotsChanged: onSlotsChanged || function () {} };
}
function resolveSlots(slots, categories) {
  var itemsOf = {};
  categories.forEach(function (c) { itemsOf[c.name] = c.items; });
  var used = {};
  function usedIn(cat) { if (!used[cat]) used[cat] = {}; return used[cat]; }
  var results = slots.map(function () { return null; });

  slots.forEach(function (slot, i) {
    if (slot.category && slot.item && !usedIn(slot.category)[slot.item]) {
      usedIn(slot.category)[slot.item] = true;
      results[i] = { category: slot.category, item: slot.item, fixed: true, rolledCategory: false };
    }
  });
  slots.forEach(function (slot, i) {
    if (results[i] || !slot.category) return;
    var items = (itemsOf[slot.category] || []).filter(function (it) { return !usedIn(slot.category)[it]; });
    var item = pickRandom(items);
    if (item) {
      usedIn(slot.category)[item] = true;
      results[i] = { category: slot.category, item: item, fixed: false, rolledCategory: false };
    }
  });
  slots.forEach(function (slot, i) {
    if (results[i]) return;
    var open = categories.filter(function (c) {
      return c.items.some(function (it) { return !usedIn(c.name)[it]; });
    });
    var category = pickRandom(open);
    if (!category) return;
    var item = pickRandom(category.items.filter(function (it) { return !usedIn(category.name)[it]; }));
    if (!item) return;
    usedIn(category.name)[item] = true;
    results[i] = {
      category: category.name, item: item, fixed: false, rolledCategory: !slot.category,
      fallbackNote: slot.category ? "Every " + slot.category + " item was already in this lab, so this slot rolled a new category instead of repeating one." : undefined
    };
  });
  return results.map(function (r, i) {
    return r || { category: slots[i].category || "Freestyle", item: "Free choice", fixed: false, rolledCategory: true };
  });
}
/* Re-roll just one slot, writing the roll straight into its dropdowns:
   a fixed category keeps the category and rolls a fresh item (never one
   another slot already holds); an empty slot rolls category + item. */
function rerollSlot(picker, slot) {
  var categories = effectiveCategories();
  if (slot.category) {
    var cat = null;
    categories.forEach(function (c) { if (c.name === slot.category) cat = c; });
    if (!cat) return;
    var taken = takenByOtherSlot(picker, slot);
    var options = cat.items.filter(function (it) { return !taken[it] && it !== slot.item; });
    if (options.length === 0) options = cat.items.filter(function (it) { return !taken[it]; });
    var item = pickRandom(options);
    if (item) slot.item = item;
  } else {
    var cat2 = pickRandom(categories);
    if (!cat2) return;
    slot.category = cat2.name;
    slot.item = pickRandom(cat2.items) || "";
  }
}
function takenByOtherSlot(picker, slot) {
  var taken = {};
  if (!slot.category) return taken;
  picker.slots.forEach(function (s) {
    if (s !== slot && s.category === slot.category && s.item) taken[s.item] = true;
  });

}

function paintPicker(id) {
  var el = document.querySelector('[data-picker="' + id + '"]');

}
function wirePicker(id) {
  var el = document.querySelector('[data-picker="' + id + '"]');
  if (!el || el.getAttribute("data-wired") === "1") return;
  el.setAttribute("data-wired", "1");
  var picker = pickers[id];
  var catItemDrafts = {}; // uid -> [items] while a new-category form is open
  function findSlot(uid) {
    for (var i = 0; i < picker.slots.length; i++) if (picker.slots[i].uid === uid) return picker.slots[i];
    return null;
  }
  function focusNewCat(uid) {
    setTimeout(function () {
      var inp = el.querySelector('[data-uid="' + uid + '"] [data-field="new-category"]');
      if (inp) { inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {} }
    }, 30);
  }
  function paintCatItems(slotEl, uid) {
    var host = slotEl.querySelector("[data-cat-items]");
    if (!host) return;
    host.innerHTML = (catItemDrafts[uid] || []).map(function (it) {
      return '<span class="pairchip">' + esc(it) + ' <button type="button" data-act="del-cat-item" data-item="' + esc(it) + '" aria-label="Remove item ' + esc(it) + ' from the new category" style="color:var(--volt);padding:0 2px;">×</button></span>';
    }).join(" ");
  }
  el.addEventListener("change", function (e) {
    var slotEl = e.target.closest("[data-uid]");
    if (!slotEl) return;
    var slot = findSlot(slotEl.getAttribute("data-uid"));
    if (!slot) return;
    var field = e.target.getAttribute("data-field");
    if (field === "category") {
      if (e.target.value === ADD_CATEGORY_VALUE) {
        picker.addingCatUid = slot.uid;
        paintPicker(id);
        focusNewCat(slot.uid);
        return;
      }
      slot.category = e.target.value;
      slot.item = "";
      picker.addingUid = null;
      picker.addingCatUid = null;
    } else if (field === "item") {
      if (e.target.value === ADD_ITEM_VALUE) {
        picker.addingUid = slot.uid;
        paintPicker(id);
        var inp = el.querySelector('[data-uid="' + slot.uid + '"] [data-field="new-item"]');
        if (inp) inp.focus();
        return;
      }
      slot.item = e.target.value;
    } else { return; }
    picker.onSlotsChanged();
    paintPicker(id);
  });
  el.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var slotEl = e.target.closest("[data-uid]");
    var slot = slotEl ? findSlot(slotEl.getAttribute("data-uid")) : null;
    var act = btn.getAttribute("data-act");
    if (act === "reroll-slot" && slot) {
      rerollSlot(picker, slot);
      picker.onSlotsChanged();
      paintPicker(id);
    } else if (act === "remove-slot" && slot) {
      picker.slots = picker.slots.filter(function (x) { return x !== slot; });
      if (picker.addingUid === slot.uid) picker.addingUid = null;
      if (picker.addingCatUid === slot.uid) picker.addingCatUid = null;
      picker.onSlotsChanged();
      paintPicker(id);
    } else if (act === "toggle-newcat" && slot) {
      picker.addingCatUid = picker.addingCatUid === slot.uid ? null : slot.uid;
      paintPicker(id);
      if (picker.addingCatUid === slot.uid) focusNewCat(slot.uid);
    } else if (act === "cancel-cat" && slot) {
      picker.addingCatUid = null;
      delete catItemDrafts[slot.uid];
      paintPicker(id);
    } else if (act === "add-cat-item" && slot) {
      var itemInp = slotEl.querySelector('[data-field="new-category-item"]');
      var v = itemInp ? itemInp.value.trim() : "";
      if (!v) return;
      var list = catItemDrafts[slot.uid] || (catItemDrafts[slot.uid] = []);
      if (!list.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) list.push(v);
      itemInp.value = "";
      paintCatItems(slotEl, slot.uid);
      itemInp.focus();
    } else if (act === "del-cat-item" && slot) {
      var it = btn.getAttribute("data-item");
      catItemDrafts[slot.uid] = (catItemDrafts[slot.uid] || []).filter(function (x) { return x !== it; });
      paintCatItems(slotEl, slot.uid);
    } else if (act === "create-category" && slot) {
      var nameInp = slotEl.querySelector('[data-field="new-category"]');
      var name = nameInp ? nameInp.value.trim() : "";
      if (!name) { if (nameInp) nameInp.focus(); return; }
      var created = addCustomCategory(name);
      (catItemDrafts[slot.uid] || []).forEach(function (it) { addCategoryItem(created, it); });
      delete catItemDrafts[slot.uid];
      slot.category = created;
      slot.item = "";
      picker.addingCatUid = null;
      Object.keys(pickers).forEach(function (pid) { paintPicker(pid); });
      picker.onSlotsChanged();
      showToast("Category saved — it's in every picker now.");
    } else if (act === "cancel-add") {
      picker.addingUid = null;
      paintPicker(id);
    }
  });
  el.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var field = e.target.getAttribute && e.target.getAttribute("data-field");
    if (field === "new-category" || field === "new-category-item") {
      /* These fields live inside other forms in some hosts — Enter
         must never submit an outer form from here. */
      e.preventDefault();
      var slotEl = e.target.closest("[data-uid]");
      if (!slotEl) return;
      var btn = slotEl.querySelector(field === "new-category" ? '[data-act="create-category"]' : '[data-act="add-cat-item"]');
      if (btn) btn.click();
    }
  });
  el.addEventListener("submit", function (e) {
    var form = e.target.closest('[data-act="add-item-form"]');
    if (!form) return;
    e.preventDefault();
    var slotEl = e.target.closest("[data-uid]");
    var slot = slotEl ? findSlot(slotEl.getAttribute("data-uid")) : null;
    var inp = form.querySelector('[data-field="new-item"]');
    var value = inp ? inp.value.trim() : "";
    if (!slot || !value) return;
    addCategoryItem(slot.category, value);
    slot.item = value;
    picker.addingUid = null;
    /* Re-render every picker so the new item is pickable everywhere. */
    Object.keys(pickers).forEach(function (pid) { paintPicker(pid); });
    picker.onSlotsChanged();
  });
}

/* =====================================================================
   Practice session — full-screen.
   Together: every item on screen at once, layered, freeform, one
   countdown for the drill length; beeps and vibrates at zero.
   In turn: one item at a time, 30 seconds each on a progress bar;
   labs cycle into new rounds, party steps end after one pass.
   ===================================================================== */
var roundsFx = {
  raf: null, dots: [], canvas: null,
  start: function (canvas) {
    this.stop();

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var pw = Math.round(w * dpr), ph = Math.round(h * dpr);

      if (self.dots.length === 0) seed(w, h);

      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var stage = session.mode === "rounds" ? session.roundStage() - 1 : 0;
      var dimmed = session.mode === "rounds" && session.phase === "break";
      var litCount = Math.floor(self.dots.length * (0.35 + stage * 0.22));

    h += '<div id="labs-edit-notes-list" class="mt2"></div>';
    h += "</div>";
  }
  h += "</div>";
  el.innerHTML = h;
  var nameInput = document.getElementById("labs-name");
  if (nameInput) {
    nameInput.addEventListener("input", function (e) { state.labsName = e.target.value; });
  }
  document.getElementById("labs-save").addEventListener("click", function () {
    var name = editing ? (state.labsName.trim() || labName(clean)) : labName(clean);
    if (editing && !editing.baked) {
      state.localLabs = state.localLabs.map(function (l) {
        return l.id === editing.id ? { id: l.id, name: name, pairs: clean, source: l.source || "" } : l;
      });
      storeSet(LS_LABS, state.localLabs);
    } else if (editing && editing.baked) {
      hideBakedLab(editing);
      saveLocalLab(name, clean, editing.source || "");
    } else {
      saveLocalLab(name, clean, "");
    }
    state.editingLabId = null;
    state.labsName = "";
    pickers.labs.slots = [newSlot("", "")];
    renderLabs();
    if (state.source === "lab") renderPicker();
    updateLabsLabel();
    showToast("Saved — it's in your labs below.");
  });
  var sendBtn = document.getElementById("labs-send");
  if (sendBtn) {
    sendBtn.addEventListener("click", function () {
      if (!state.drills.some(function (d) { return d.name === effectiveName; })) {
        state.drills.push({ id: newId("drill"), name: effectiveName, pairs: clean });
        queue.onDrillsChanged();
      }
      showToast("Sent — it's queued in Today on the Timer.");
      renderLabsYourLab();
    });
  }
  var cancelBtn = document.getElementById("labs-cancel-edit");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", function () {
      state.editingLabId = null;
      state.labsName = "";
      state.labsEditNoteSearch = "";
      pickers.labs.slots = [newSlot("", "")];
      renderLabs();
    });
  }
  var noteSearch = document.getElementById("labs-edit-note-search");
  if (noteSearch && editing) {
    noteSearch.addEventListener("input", function (e) {
      state.labsEditNoteSearch = e.target.value;
      renderLabsEditNotesList(editing);
    });
    renderLabsEditNotesList(editing);
  }
}
function renderLabsEditNotesList(lab) {
  var host = document.getElementById("labs-edit-notes-list");
  if (!host || !lab) return;
  var labNameStr = lab.name || labName(pairsForLab(lab));
  var q = state.labsEditNoteSearch.trim().toLowerCase();
  var notes = allUnifiedNotes().filter(function (n) {
    return !q || n.title.toLowerCase().indexOf(q) !== -1 || n.body.toLowerCase().indexOf(q) !== -1;
  });
  if (notes.length === 0) {
    host.innerHTML = '<p class="dim small" style="margin:0;">No notes match that.</p>';
    return;
  }
  host.innerHTML = notes.map(function (n) {
    var attached = (state.noteLabLinks[n.key] || []).indexOf(labNameStr) !== -1;
    return '<button type="button" class="btn" data-labnote="' + esc(n.key) + '" aria-pressed="' + (attached ? "true" : "false") + '" style="display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;margin-top:6px;padding:8px 12px;border-radius:8px;' + (attached ? "border-color:rgba(255,210,63,0.6);background:rgba(255,210,63,0.1);color:var(--volt);" : "") + '"><span style="min-width:0;overflow-wrap:break-word;">' + esc(n.title) + ' <span class="dim" style="font-weight:400;">· ' + esc(n.group) + "</span></span>" + (attached ? icon("check", 16) : "") + "</button>";
  }).join("");
  host.querySelectorAll("[data-labnote]").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-labnote");
      var links = (state.noteLabLinks[key] || []).slice();
      var at = links.indexOf(labNameStr);
      if (at === -1) links.push(labNameStr); else links.splice(at, 1);
      if (links.length) state.noteLabLinks[key] = links; else delete state.noteLabLinks[key];
      storeSet(LS_NOTELINKS, state.noteLabLinks);
      renderLabsEditNotesList(lab);
      renderLabsList();
    });
  });
}
function renderLabsList() {
  var el = document.getElementById("labs-list");
  if (!el) return;
  var labs = allLabs();
  if (labs.length === 0) {
    el.innerHTML = '<p class="dim base">No labs yet — build one above and save it.</p>';
    return;
  }
  if (!state.labNotesOpen) state.labNotesOpen = {};
  el.innerHTML = labs.map(function (lab) {
    var pairs = pairsForLab(lab);
    var name = lab.name || labName(pairs);
    var inTimer = labInTimer(lab);
    var noteKeys = labNoteKeys(lab);
    var notesOpen = !!state.labNotesOpen[lab.id];
    var h = '<article class="card lab-card" aria-label="Lab ' + esc(name) + '">';
    h += '<h3 class="fd" style="font-size:18px;font-weight:900;margin:0;overflow-wrap:break-word;">' + esc(name) + "</h3>";
    h += '<div class="mt2" style="display:grid;gap:2px;">';
    pairs.forEach(function (pr) {
      h += '<p style="margin:0;font-size:15px;line-height:1.35;"><span class="kicker accent" style="margin-right:8px;">' + esc(pr.category) + '</span><span style="font-weight:600;">' + esc(pairLabel(pr)) + "</span></p>";
    });
    h += "</div>";
    /* One Notes row per card, always shown — even at zero notes.
       Tapping it opens the lab's notes; Add note sits at the top of
       that list. There is no separate Add note button. */
    h += '<div class="mt3">';
    h += '<button type="button" class="btn" data-lab-notes="' + esc(lab.id) + '" aria-expanded="' + (notesOpen ? "true" : "false") + '" aria-label="' + (notesOpen ? "Hide" : "Show") + ' the ' + noteKeys.length + ' notes for lab ' + esc(name) + '" style="padding:6px 12px;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);">' + icon("note", 14) + ' Notes · ' + noteKeys.length + " " + (notesOpen ? icon("chevU", 14) : icon("chevD", 14)) + "</button>";
    if (notesOpen) {
      h += '<div class="mt2">';
      h += '<button type="button" class="btn" data-lab-addnote="' + esc(lab.id) + '" aria-label="Add a note to lab ' + esc(name) + ' — its items start as the note\'s tags" style="border-color:rgba(255,210,63,0.6);color:var(--volt);padding:8px 16px;font-weight:700;">' + icon("note", 16) + " Add note</button>";
      if (noteKeys.length > 0) {
        h += '<div class="row wrap mt2" style="gap:6px;">';
        noteKeys.forEach(function (key) {
          var n = findUnifiedNote(key);
          if (!n) return;
          h += '<button type="button" class="tagchip" data-lab-open-note="' + esc(key) + '" aria-label="Open note for this lab: ' + esc(n.title) + '">' + esc(n.title) + "</button>";
        });
        h += "</div>";
      } else {
        h += '<p class="dim small mt2" style="margin-bottom:0;">No notes for this lab yet.</p>';
      }
      h += "</div>";
    }
    h += "</div>";
    h += '<div class="lab-actions" style="align-items:center;">';
    h += '<button type="button" class="btn btn-accent" data-lab-practice="' + esc(lab.id) + '" style="padding:7px 14px;font-size:13px;">' + icon("play", 14) + " Practice</button>";
    h += '<span style="flex:1;"></span>';
    if (inTimer) {
      h += '<span class="iconbtn" aria-disabled="true" title="In the Timer" aria-label="' + esc(name) + ' is in the Timer" style="color:var(--volt);border-color:var(--volt);">' + icon("check", 18) + "</span>";
    } else {
      h += '<button type="button" class="iconbtn" data-lab-send="' + esc(lab.id) + '" title="Add to Timer" aria-label="Add ' + esc(name) + ' to the Timer">' + icon("timer", 18) + "</button>";
    }
    h += '<button type="button" class="iconbtn" data-lab-edit="' + esc(lab.id) + '" title="Edit" aria-label="Edit ' + esc(name) + '">' + icon("pencil", 18) + "</button>";
    h += '<button type="button" class="iconbtn" data-lab-dup="' + esc(lab.id) + '" title="Duplicate" aria-label="Duplicate ' + esc(name) + '">' + icon("copy", 18) + "</button>";
    h += '<button type="button" class="iconbtn" data-lab-del="' + esc(lab.id) + '" title="Delete" aria-label="Delete ' + esc(name) + '">' + icon("trash", 18) + "</button>";
    h += "</div></article>";
    return h;
  }).join("");
  el.querySelectorAll("[data-lab-notes]").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-lab-notes");
      state.labNotesOpen[id] = !state.labNotesOpen[id];
      renderLabsList();
    });
  });
  el.querySelectorAll("[data-lab-addnote]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-addnote"));
      if (!lab) return;
      var seen = {};
      var tags = [];
      pairsForLab(lab).forEach(function (pr) {
        var t = pairLabel(pr);
        var k = t.toLowerCase();
        if (!seen[k]) { seen[k] = true; tags.push(t); }
      });
      openNoteWriter(tags, "labs");
    });
  });
  el.querySelectorAll("[data-lab-open-note]").forEach(function (b) {
    b.addEventListener("click", function () { openNoteDetail(b.getAttribute("data-lab-open-note")); });
  });
  el.querySelectorAll("[data-lab-practice]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-practice"));
      if (!lab) return;
      state.selectedLabId = lab.id;
      state.source = "lab";
      switchTab("timer");
      renderPicker();
      document.getElementById("view-timer").scrollTop = 0;
    });
  });
  el.querySelectorAll("[data-lab-send]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-send"));
      if (lab) { sendLabToTimer(lab); renderLabsList(); }
    });
  });
  el.querySelectorAll("[data-lab-edit]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-edit"));
      if (!lab) return;
      var pairs = pairsForLab(lab);
      pickers.labs.slots = pairs.map(function (pr) { return newSlot(pr.category, pr.item); });
      if (pickers.labs.slots.length === 0) pickers.labs.slots = [newSlot("", "")];
      state.editingLabId = lab.id;
      state.labsName = lab.name || "";
      state.labsEditNoteSearch = "";
      renderLabs();
      document.getElementById("view-labs").scrollTop = 0;
    });
  });
  el.querySelectorAll("[data-lab-dup]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-dup"));
      if (!lab) return;
      var pairs = pairsForLab(lab).map(function (pr) { return { category: pr.category, item: pr.item || "" }; });
      saveLocalLab((lab.name || labName(pairs)) + " copy", pairs, lab.source || "");
      renderLabsList();
      updateLabsLabel();
      showToast("Duplicated — the copy is in your labs.");
    });
  });
  el.querySelectorAll("[data-lab-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-del"));
      if (!lab) return;
      var name = lab.name || labName(pairsForLab(lab));
      openConfirm({
        title: "Delete this lab?",
        body: "“" + name + "” and its notes links will be removed.",
        confirmLabel: "Delete it",
        onConfirm: function () {
          if (lab.baked) hideBakedLab(lab);
          else deleteLocalLab(lab.id);
          Object.keys(state.noteLabLinks).forEach(function (key) {
            var links = state.noteLabLinks[key].filter(function (n) { return n !== name; });
            if (links.length) state.noteLabLinks[key] = links; else delete state.noteLabLinks[key];
          });
          storeSet(LS_NOTELINKS, state.noteLabLinks);
          if (state.selectedLabId === lab.id) state.selectedLabId = null;
          if (state.editingLabId === lab.id) { state.editingLabId = null; state.labsName = ""; renderLabs(); }
          else renderLabsList();
          if (state.source === "lab") renderPicker();
          updateLabsLabel();
        }
      });
    });
  });
}

/* ------------------------- export / import --------------------------- */
function exportLabs() {
  var mergedCustom = {};
  var bakedCustom = (DATA && DATA.customItems) || {};
  Object.keys(bakedCustom).forEach(function (k) { mergedCustom[k] = bakedCustom[k].slice(); });
  Object.keys(state.customItems).forEach(function (k) {
    mergedCustom[k] = (mergedCustom[k] || []).concat((state.customItems[k] || []).filter(function (it) {
      return (mergedCustom[k] || []).indexOf(it) === -1;
    }));
  });
  var payload = {
    labs: allLabs().map(function (l) {
      return {
        name: l.name || labName(pairsForLab(l)),
        pairs: pairsForLab(l).map(function (p) { return { category: p.category, item: p.item || "" }; })
      };
    }),
    customItems: mergedCustom
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "labs.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  showToast("Exported " + payload.labs.length + (payload.labs.length === 1 ? " lab" : " labs") + " to labs.json.");
}
function labsFileStatus(msg) {
  var el = document.getElementById("labs-file-status");
  if (!el) return;
  el.textContent = msg;
  el.hidden = !msg;
}
document.getElementById("import-file").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(String(reader.result || ""));
      var list = Array.isArray(parsed) ? parsed : parsed.labs;
      if (!Array.isArray(list)) throw new Error("no labs array");
      /* Custom items in the file join the lists first, so labs that use
         them validate instead of being skipped. */
      if (parsed && !Array.isArray(parsed) && parsed.customItems && typeof parsed.customItems === "object") {
        Object.keys(parsed.customItems).forEach(function (cat) {
          (parsed.customItems[cat] || []).forEach(function (item) { addCategoryItem(cat, String(item)); });
        });
      }
      var cats = effectiveCategories();
      var valid = {};
      cats.forEach(function (c) {
        valid[c.name] = {};
        c.items.forEach(function (it) { valid[c.name][it] = true; });
      });
      var existing = {};
      allLabs().forEach(function (l) { existing[labSignature({ name: l.name, pairs: pairsForLab(l) })] = true; });
      var added = 0;
      var skipped = 0;
      list.forEach(function (raw) {
        if (!raw || !Array.isArray(raw.pairs) || raw.pairs.length === 0) { skipped += 1; return; }
        var pairs = [];
        var ok = true;
        raw.pairs.forEach(function (p) {
          if (!p || !p.category || !valid[String(p.category)]) { ok = false; return; }
          var item = p.item === null || p.item === undefined ? "" : String(p.item);
          /* An empty item is a random slot — valid for its category. */
          if (item !== "" && !valid[String(p.category)][item]) { ok = false; return; }
          pairs.push({ category: String(p.category), item: item });
        });
        if (!ok || pairs.length === 0) { skipped += 1; return; }
        var name = raw.name ? String(raw.name) : labName(pairs);
        var sig = labSignature({ name: name, pairs: pairs });
        if (existing[sig]) { skipped += 1; return; }
        existing[sig] = true;
        state.localLabs.unshift({ id: newId("lab"), name: name, pairs: pairs, source: raw.source || "" });
        added += 1;
      });
      storeSet(LS_LABS, state.localLabs);
      renderLabsList();
      renderLabs();
      if (state.source === "lab") renderPicker();
      updateLabsLabel();
      var msg = "Imported " + added + (added === 1 ? " new lab." : " new labs.");
      if (skipped > 0) msg += " Skipped " + skipped + (skipped === 1 ? " lab" : " labs") + " — already here, or their categories/items don't match your lists.";
      labsFileStatus(msg);
    } catch (err) {
      labsFileStatus("That file couldn't be read as a labs.json — nothing was imported.");
    }
  };
  reader.readAsText(file);
});

function noteTitleFromBody(body) {
  var lines = String(body || "").split("\n");
  for (var i = 0; i < lines.length; i++) if (lines[i].trim().length > 0) return lines[i].trim();
  return "Untitled note";
}
function allUnifiedNotes() {
  var mine = state.userNotes.map(function (n) {
    return { key: "user-" + n.id, id: n.id, title: noteTitleFromBody(n.body), group: "My notes", body: n.body, userId: n.id };
  });
  var hidden = {};
  state.hiddenNotes.forEach(function (k) { hidden[k] = true; });
  var built = DATA.notes.filter(function (n) { return !hidden[n.id]; }).map(function (n) {
    return { key: n.id, id: n.id, title: n.title, group: n.group, body: n.body, userId: null };
  });
  return mine.concat(built);
}
function findUnifiedNote(key) {
  var all = allUnifiedNotes();
  for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
  return null;
}
function usedTags() {
  var counts = {};
  Object.keys(state.noteTags).forEach(function (key) {
    (state.noteTags[key] || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
  });
  return Object.keys(counts).sort(function (x, y) {
    return counts[y] - counts[x] || x.localeCompare(y);
  });
}
function vocabList() {
  var seen = {}, out = [];
  function push(v) { var k = v.toLowerCase(); if (!seen[k]) { seen[k] = true; out.push(v); } }
  effectiveCategories().forEach(function (c) { push(c.name); c.items.forEach(push); });
  usedTags().forEach(push);
  return out;
}
function labNoteKeys(lab) {
  var name = lab.name || labName(pairsForLab(lab));
  var items = {};
  pairsForLab(lab).forEach(function (pr) { if (pr.item) items[pr.item.toLowerCase()] = true; });
  var keys = [], seen = {};
  allUnifiedNotes().forEach(function (n) {
    var manual = (state.noteLabLinks[n.key] || []).indexOf(name) !== -1;
    var tagged = (state.noteTags[n.key] || []).some(function (t) { return !!items[t.toLowerCase()]; });
    if ((manual || tagged) && !seen[n.key]) { seen[n.key] = true; keys.push(n.key); }
  });
  return keys;
}

/* ---------------- keyword suggestions (stem-matched) ----------------- */
function normalizeForMatch(text) {
  return String(text).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'°]+/g, " ").replace(/\s+/g, " ").trim();
}
function stemsOf(word) {
  var stems = {};
  stems[word] = true;
  if (word.endsWith("s") && word.length > 3) stems[word.slice(0, -1)] = true;
  if (word.endsWith("ing") && word.length > 5) {
    var base = word.slice(0, -3);
    stems[base] = true;
    stems[base + "e"] = true;
    if (base.length > 1 && base[base.length - 1] === base[base.length - 2]) stems[base.slice(0, -1)] = true;
  }
  if (word.endsWith("ed") && word.length > 4) stems[word.slice(0, -2)] = true;
  return Object.keys(stems).filter(function (x) { return x.length >= 3; });
}
/* Items from her own lists that the note text points at — an exact
   phrase hit, a whole-word hit, or a stem hit, so writing "trace"
   offers "Traces". Offered only, never applied. */
function suggestKeywords(text, vocab, selected) {
  var norm = normalizeForMatch(text || "");
  var haystack = " " + norm + " ";
  var words = {};
  norm.split(" ").forEach(function (w) { if (w) words[w] = true; });
  var taken = {};
  (selected || []).forEach(function (t) { taken[t.toLowerCase()] = true; });
  var found = [];
  vocab.forEach(function (item) {
    if (taken[item.toLowerCase()]) return;
    var needle = normalizeForMatch(item);
    if (needle.length < 3) return;
    var hit = haystack.indexOf(" " + needle + " ") !== -1 || haystack.indexOf(" " + needle + "s ") !== -1;
    if (!hit && needle.indexOf(" ") === -1) {
      var stems = stemsOf(needle);
      for (var i = 0; i < stems.length && !hit; i++) {
        if (words[stems[i]]) { hit = true; break; }
        if (stems[i].length >= 4) {
          for (var w in words) { if (w.indexOf(stems[i]) === 0) { hit = true; break; } }
        }
      }
    }
    if (hit) found.push(item);
  });
  return found.sort(function (x, y) { return y.length - x.length; }).slice(0, 12);
}

/* ------------------------------ tag editor --------------------------- */
/* ONE autocomplete input, because tagging has to be fast: type and a
   dropdown lists everything taggable that matches — every item in
   every category, the category names themselves (a category IS a
   tag), and tags already in use — plus an "add as new tag" row.
   Picking acts on mouse-down, before the input can blur, so the
   keyboard never has to close; unpicked text stays in the input. */
var tagEditors = {};
function registerTagEditor(id, opts) {
  tagEditors[id] = { draft: "", focused: false, getTags: opts.getTags, setTags: opts.setTags, getText: opts.getText };
}
function tagVocabEntries() {
  var out = [], seen = {};
  function push(label, hint) { var k = label.toLowerCase(); if (seen[k]) return; seen[k] = true; out.push({ label: label, hint: hint }); }
  effectiveCategories().forEach(function (c) { push(c.name, "Category"); c.items.forEach(function (it) { push(it, c.name); }); });
  usedTags().forEach(function (t) { push(t, "Tag in use"); });
  return out;
}
function tagEditorMatches(id) {
  var ed = tagEditors[id];
  var q = ed.draft.trim().toLowerCase();
  if (!q) return { matches: [], showNew: false };
  var tags = ed.getTags();
  var entries = tagVocabEntries();
  var matches = entries.filter(function (e) {
    return e.label.toLowerCase().indexOf(q) !== -1 && !tags.some(function (t) { return t.toLowerCase() === e.label.toLowerCase(); });
  }).sort(function (x, y) {
    var xp = x.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    var yp = y.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    return xp - yp || x.label.localeCompare(y.label);
  }).slice(0, 8);

        storeSet(LS_NOTES, state.userNotes);

        renderNotes();

/* -------------------------------- split ------------------------------ */
var splitChunksState = [];
/* Blocks separated by blank lines; a single block falls back to one
   chunk per line. Each chunk keeps the exact separator that stood
   before it, so merging reproduces the original byte-for-byte. */
function initialChunks(body) {
  var blocks = String(body).split(/\n[ \t]*\n/);
  if (blocks.length > 1) {
    return blocks.map(function (text, i) { return { text: text, joiner: i === 0 ? "" : "\n\n" }; })
      .filter(function (c) { return c.text.trim().length > 0; });
  }
  var lines = String(body).split("\n");
  if (lines.length > 1) {
    return lines.map(function (text, i) { return { text: text, joiner: i === 0 ? "" : "\n" }; })
      .filter(function (c) { return c.text.trim().length > 0; });
  }
  return [{ text: body, joiner: "" }];
}
function splitChunkByLine(chunk) {
  return chunk.text.split("\n").map(function (text, i) {
    return { text: text, joiner: i === 0 ? chunk.joiner : "\n" };
  }).filter(function (c) { return c.text.trim().length > 0; });
}
function renderNoteSplit(el) {
  el = el || document.getElementById("view-notes");
  var note = findUnifiedNote(state.noteOpenKey);
  if (!note) { state.noteSplitting = false; state.noteOpenKey = null; renderNotesList(el); return; }
  var live = splitChunksState.filter(function (c) { return c.text.trim().length > 0; });
  var h = '<button type="button" class="btn fd" id="split-back" aria-label="Back to the previous screen" style="padding:10px 18px;font-size:15px;font-weight:700;text-transform:uppercase;background:var(--surface);">' + icon("chevL", 20) + " Back</button>";
  h += '<h2 class="fd" style="font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;margin:20px 0 0;">Split note</h2>';
  h += '<p class="dim" style="font-size:16px;margin:6px 0 0;">Each piece below becomes its own note, with its text exactly as written. Tags and labs carry over to every piece. Merge pieces back together, split a piece by line, or trash a piece to leave it out.</p>';
  h += '<div class="mt4" style="display:grid;gap:12px;">';
  live.forEach(function (chunk, i) {
    h += '<div class="card" style="padding:12px 14px;">';
    h += '<p class="kicker volt" style="margin:0;">Piece ' + (i + 1) + "</p>";
    h += '<pre style="white-space:pre-wrap;overflow-wrap:break-word;font-size:16px;line-height:1.5;font-family:inherit;margin:6px 0 0;">' + esc(chunk.text) + "</pre>";
    h += '<div class="row wrap mt2" style="gap:8px;">';
    if (chunk.text.indexOf("\n") !== -1) {
      h += '<button type="button" class="btn" data-split-line="' + i + '" aria-label="Split piece ' + (i + 1) + ' into one note per line" style="padding:6px 12px;font-size:12px;font-weight:700;">Split by line</button>';
    }
    if (i < live.length - 1) {
      h += '<button type="button" class="btn" data-split-merge="' + i + '" aria-label="Merge piece ' + (i + 1) + ' with piece ' + (i + 2) + '" style="padding:6px 12px;font-size:12px;font-weight:700;">Merge with next</button>';
    }
    h += '<button type="button" class="iconbtn" data-split-trash="' + i + '" aria-label="Delete piece ' + (i + 1) + ' — throw it away" style="padding:6px;">' + icon("trash", 16) + "</button>";
    h += "</div></div>";
  });
  h += "</div>";
  h += '<button type="button" class="btn-lg btn-lg-primary mt4" id="split-confirm" style="width:100%;"' + (live.length < 2 ? " disabled" : "") + ' aria-label="Split this note into ' + live.length + ' notes">Split into ' + live.length + " notes</button>";
  h += '<button type="button" class="btn-lg btn-lg-ghost mt2" id="split-cancel" style="width:100%;" aria-label="Cancel splitting">Cancel</button>';
  el.innerHTML = h;
  document.getElementById("split-back").addEventListener("click", function () { state.noteSplitting = false; renderNotes(); });
  document.getElementById("split-cancel").addEventListener("click", function () { state.noteSplitting = false; renderNotes(); });
  el.querySelectorAll("[data-split-line]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-line"))];
      var at = splitChunksState.indexOf(chunk);
      if (at < 0) return;
      splitChunksState = splitChunksState.slice(0, at).concat(splitChunkByLine(chunk)).concat(splitChunksState.slice(at + 1));
      renderNotes();
    });
  });
  el.querySelectorAll("[data-split-merge]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-merge"))];
      var at = splitChunksState.indexOf(chunk);
      var nxt = splitChunksState[at + 1];
      if (at < 0 || !nxt) return;
      var merged = { text: chunk.text + nxt.joiner + nxt.text, joiner: chunk.joiner };
      splitChunksState = splitChunksState.slice(0, at).concat([merged]).concat(splitChunksState.slice(at + 2));
      renderNotes();
    });
  });
  el.querySelectorAll("[data-split-trash]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-trash"))];
      splitChunksState = splitChunksState.filter(function (c) { return c !== chunk; });
      renderNotes();
    });
  });
  document.getElementById("split-confirm").addEventListener("click", function () {
    var good = splitChunksState.filter(function (c) { return c.text.trim().length > 0; });
    if (good.length < 2) return;
    var tags = (state.noteTags[note.key] || []).slice();
    var links = (state.noteLabLinks[note.key] || []).slice();
    good.forEach(function (chunk) {
      var nn = { id: newId("note"), body: chunk.text };
      state.userNotes.unshift(nn);
      var k = "user-" + nn.id;
      if (tags.length) state.noteTags[k] = tags.slice();
      if (links.length) state.noteLabLinks[k] = links.slice();
    });
    if (note.userId !== null) {
      state.userNotes = state.userNotes.filter(function (n) { return n.id !== note.userId; });
      delete state.noteTags[note.key];
      delete state.noteLabLinks[note.key];
    } else {
      if (state.hiddenNotes.indexOf(note.key) === -1) state.hiddenNotes.push(note.key);
      storeSet(LS_HIDDEN_NOTES, state.hiddenNotes);
    }
    storeSet(LS_NOTES, state.userNotes);
    storeSet(LS_NOTETAGS, state.noteTags);
    storeSet(LS_NOTELINKS, state.noteLabLinks);
    state.noteSplitting = false;
    state.noteOpenKey = null;
    renderNotes();
    renderLabsList();
    showToast("Split into " + good.length + " notes — each one kept its exact text and tags.");
  });
}

/* --------------------------- categories screen ----------------------- */
/* Its own screen for adding a category with no lab involved (reached
   from the Notes floating-plus fan). Saving makes the category appear
   in every picker. */
var catDraftItems = [];
var catDraftName = "";
function openCategoriesScreen() {
  catDraftItems = [];
  catDraftName = "";
  renderCategoriesScreen();
  document.getElementById("cat-view").hidden = false;
  document.getElementById("cat-view").scrollTop = 0;
  setTimeout(function () {
    var inp = document.getElementById("cat-name");
    if (inp) inp.focus();
  }, 30);
}
function closeCategoriesScreen() {
  var el = document.getElementById("cat-view");
  el.hidden = true;
  el.innerHTML = "";
}
function renderCategoriesScreen() {
  var el = document.getElementById("cat-view");
  var existing = effectiveCategories().map(function (c) { return c.name; });
  var h = '<div style="max-width:768px;margin:0 auto;padding:12px 16px 32px;">';
  h += '<button type="button" class="btn fd" id="cat-back" aria-label="Back to the previous screen" style="padding:10px 18px;font-size:15px;font-weight:700;text-transform:uppercase;background:var(--surface);">' + icon("chevL", 20) + " Back</button>";
  h += '<h2 class="fd" style="font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;margin:20px 0 0;">Add category</h2>';
  h += '<label class="kicker dim" for="cat-name" style="display:block;margin-top:16px;">Category name</label>';
  h += '<input class="field mt1" id="cat-name" placeholder="New category name" autocomplete="off" maxlength="40" value="' + esc(catDraftName) + '" />';
  h += '<p class="small mt1" id="cat-clash" style="color:var(--dim);margin-bottom:0;" hidden></p>';
  h += '<label class="kicker dim" for="cat-item" style="display:block;margin-top:16px;">Items <span style="text-transform:none;letter-spacing:0;font-weight:400;">(optional — add more later)</span></label>';
  if (catDraftItems.length > 0) {
    h += '<div class="row wrap mt1" style="gap:6px;">';
    catDraftItems.forEach(function (it) {
      h += '<span class="tagchip">' + esc(it) + '<button type="button" class="xbtn" data-cat-del-item="' + esc(it) + '" aria-label="Remove item ' + esc(it) + ' from the new category">' + icon("x", 14) + "</button></span>";
    });
    h += "</div>";
  }
  h += '<div class="row mt1"><input class="field grow" id="cat-item" placeholder="An item for this category…" autocomplete="off" maxlength="80" />';
  h += '<button type="button" class="btn btn-volt" id="cat-add-item" style="padding:8px 14px;font-size:12px;flex:none;">Add</button></div>';
  h += '<div class="row mt4" style="gap:8px;"><button type="button" class="btn-lg btn-lg-volt" id="cat-create">Create category</button>';
  h += '<button type="button" class="btn" id="cat-cancel" style="padding:8px 10px;">Cancel</button></div>';
  h += "</div>";
  el.innerHTML = h;
  document.getElementById("cat-back").addEventListener("click", closeCategoriesScreen);
  document.getElementById("cat-cancel").addEventListener("click", closeCategoriesScreen);
  var itemInp = document.getElementById("cat-item");
  function addItem() {
    var v = itemInp.value.trim();
    if (!v) return;
    if (!catDraftItems.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) catDraftItems.push(v);
    renderCategoriesScreen();
    var inp2 = document.getElementById("cat-item");
    if (inp2) inp2.focus();
  }
  document.getElementById("cat-add-item").addEventListener("click", addItem);
  itemInp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addItem(); } });
  el.querySelectorAll("[data-cat-del-item]").forEach(function (b) {
    b.addEventListener("click", function () {
      catDraftItems = catDraftItems.filter(function (x) { return x !== b.getAttribute("data-cat-del-item"); });
      renderCategoriesScreen();
    });
  });
  var nameInp = document.getElementById("cat-name");
  nameInp.addEventListener("input", function () { catDraftName = nameInp.value; });
  nameInp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); document.getElementById("cat-create").click(); } });
  document.getElementById("cat-create").addEventListener("click", function () {
    var name = (document.getElementById("cat-name").value || "").trim();
    if (!name) { nameInp.focus(); return; }
    var clash = existing.some(function (n) { return n.toLowerCase() === name.toLowerCase(); });
    if (clash) {
      var c = document.getElementById("cat-clash");
      c.textContent = "You already have a category called “" + name + "”.";
      c.hidden = false;
      return;
    }
    var created = addCustomCategory(name);
    catDraftItems.forEach(function (it) { addCategoryItem(created, it); });
    Object.keys(pickers).forEach(function (pid) { paintPicker(pid); });
    closeCategoriesScreen();
    showToast("Category saved — it's in every picker now.");
  });
}

/* =====================================================================
   Dougie background-moments stage. Playback runs through the official
   YouTube IFrame Player API on an imperatively-created node (the API
   replaces the element it is handed), born on the youtube-nocookie
   host with an explicit origin — the configuration whose absence
   produced Error 153 in the Muse version. On a 153, a ready timeout,
   or an API load failure it falls back to a plain nocookie iframe
   splice advanced by a duration timer. A tap shield keeps every touch
   in this UI; error state is a closeable panel, never a blank page.

var ytApiPromise = null;
function loadYouTubeApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (!ytApiPromise) {
    ytApiPromise = new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("YouTube API load timed out")); }, 10000);
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () {
        if (prev) prev();
        clearTimeout(timer);
        if (window.YT) resolve(window.YT);
        else reject(new Error("YouTube API unavailable"));
      };
      var script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      script.onerror = function () { clearTimeout(timer); reject(new Error("YouTube API failed to load")); };
      document.head.appendChild(script);
    });
  }
  return ytApiPromise;
}
function spliceEmbedUrl(clip) {
  var params = "autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&disablekb=1&iv_load_policy=3&fs=0&enablejsapi=1" +
    "&start=" + Math.floor(clip.start) + "&end=" + Math.floor(clip.end);
  if (/^https?:\/\//.test(window.location.origin)) params += "&origin=" + encodeURIComponent(window.location.origin);
  return "https://www.youtube-nocookie.com/embed/" + clip.videoId + "?" + params;
}

function teardownDougiePlayer() {

function initDougiePlayer() {

  var first = dougie.clips[0];
  var origin = /^https?:\/\//.test(window.location.origin) ? window.location.origin : undefined;
  loadYouTubeApi().then(function (YT) {
    if (cancelled || !dougie.active || dougie.useFallback) return;
    var host = document.getElementById("dougie-host");
    if (!host) return;
    var mount = document.createElement("div");
    mount.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
    host.appendChild(mount);
    var playerVars = {
      autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1,
      disablekb: 1, iv_load_policy: 3, fs: 0, enablejsapi: 1

          dougie.player = e.target;

        onStateChange: function (e) {

function dougieLoadClip(i) {

    renderDougieStage();
    scheduleDougieFallback();
    return;
  }
  var c = list[idx];
  var player = dougie.player;
  if (!c || !player || !dougie.ready) { renderDougieChrome(); return; }
  try { player.loadVideoById({ videoId: c.videoId, startSeconds: c.start, endSeconds: c.end }); } catch (e) { /* play button stays up */ }

function scheduleDougieFallback() {
  if (dougie.fallbackTimer) { clearTimeout(dougie.fallbackTimer); dougie.fallbackTimer = null; }
  if (!dougie.active || !dougie.useFallback || !dougie.playing) return;
  var c = dougie.clips[dougie.index];

  dougie.fallbackTimer = setTimeout(function () { dougieLoadClip(dougie.index + 1); }, Math.max(1000, (c.end - c.start) * 1000));

  document.getElementById("dg-moments").addEventListener("click", function () { dougie.showMoments = !dougie.showMoments; renderDougieChrome(); });

  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();

      if (!videoId) { dougie.addError = "That doesn't look like a YouTube link or video ID — paste the full watch link."; renderDougieChrome(); return; }
      var s = parseTimestamp(document.getElementById("dg-start").value);
      var en = parseTimestamp(document.getElementById("dg-end").value);
      if (s === null || en === null || en <= s) { dougie.addError = "Give a start and an end after it — seconds (83) or m:ss (1:23) both work."; renderDougieChrome(); return; }
      if (en - s > 120) { dougie.addError = "Keep a moment under 2 minutes — these are tiny snippets, not whole videos."; renderDougieChrome(); return; }
      var label = document.getElementById("dg-label").value.trim() || "Your moment";
      var clipObj = { id: "custom-" + Date.now(), videoId: videoId, start: s, end: en, label: label, sourceLabel: "Added by you" };

}
function dougieRemoveClip(i) {
  var cur = dougie.index;
  var removed = dougie.clips[i];
  if (!removed) return;
  if (String(removed.id).indexOf("custom-") === 0) {
    dougie.customMoments = dougie.customMoments.filter(function (c) { return c.id !== removed.id; });
    persistCustomMoments();
  }
  dougie.clips = dougie.clips.filter(function (_, j) { return j !== i; });
  if (dougie.clips.length === 0) { dougie.clips = dougieClips(); return; }
  if (i < cur) {
    dougie.index = cur - 1;
    renderDougieChrome();
  } else if (i === cur) {
    dougieLoadClip(Math.min(cur, dougie.clips.length - 1));
  } else {
    renderDougieChrome();
  }
}

/* =====================================================================
   Conductor — a chaos double-pendulum movement director. Up to 20
   near-identical double pendulums launch together and diverge into
   chaos, each leaving a colored trail; follow the big yellow lead bob:
   where it is is where to move toward, how fast it moves is how fast
   to move. The pivot itself travels — on a drawn 4x3 grid, around a
   drawn circle, or through projected 3D space. Default speed 0.5x.
   ===================================================================== */
var conductor = {
  playing: true, editOpen: false, speed: 0.5, chaos: 5, count: 12, trail: 60,
  pivotMode: "grid", follow: "",
  pendulums: [], t: 0, raf: null, lastTs: 0,
  pivot: { x: 0, y: 0 }, gridIdx: 0, gridTimer: 0
};
function conductorReset() {
  conductor.pendulums = [];
  conductor.t = 0;
  conductor.gridIdx = 0;
  conductor.gridTimer = 0;
  var spread = 0.0016 * conductor.chaos; /* per-pendulum launch offset */
  for (var i = 0; i < conductor.count; i++) {
    var off = (i - (conductor.count - 1) / 2) * spread;
    conductor.pendulums.push({
      a1: 2.15 + off, a2: 2.75 + off * 1.7, w1: 0, w2: 0, trail: []
    });
  }
}
function pendulumStep(p, dt) {
  var g = 9.81, L1 = 1, L2 = 1, m1 = 1, m2 = 1;
  var a1 = p.a1, a2 = p.a2, w1 = p.w1, w2 = p.w2;
  var d = a1 - a2;
  var den = 2 * m1 + m2 - m2 * Math.cos(2 * d);
  var dw1 = (-g * (2 * m1 + m2) * Math.sin(a1) - m2 * g * Math.sin(a1 - 2 * a2) - 2 * Math.sin(d) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d))) / (L1 * den);
  var dw2 = (2 * Math.sin(d) * (w1 * w1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(a1) + w2 * w2 * L2 * m2 * Math.cos(d))) / (L2 * den);
  p.w1 += dw1 * dt; p.w2 += dw2 * dt;
  p.a1 += p.w1 * dt; p.a2 += p.w2 * dt;
}
function renderConductor() {
  var el = document.getElementById("view-conductor");
  var parts = bodyPartItems();
  /* The visualizer IS the page: full bleed edge to edge, no box, no
     direction text. Play/pause sits centered at the bottom; every
     control lives behind the edit icon, in a panel over the animation.
     One line of cue lives at the top of that panel. */
  var h = '<div class="conductor-wrap"><canvas id="conductor-canvas" aria-label="Chaos double pendulums — follow the big yellow bob"></canvas>';
  h += '<button type="button" class="conductor-play" id="c-playpause-main" aria-label="' + (conductor.playing ? "Pause the conductor" : "Play the conductor") + '">' + (conductor.playing ? icon("pause", 24) : icon("play", 24)) + "</button>";
  h += '<button type="button" class="conductor-edit" id="c-edit" aria-expanded="' + (conductor.editOpen ? "true" : "false") + '" aria-label="' + (conductor.editOpen ? "Hide the conductor controls" : "Edit the conductor — show its controls") + '">' + (conductor.editOpen ? icon("x", 20) : icon("pencil", 20)) + "</button>";
  if (conductor.editOpen) {
    h += '<section class="conductor-panel" aria-label="Conductor controls">';
    h += '<p class="sm2" style="margin:0 0 10px;font-weight:600;">Follow the yellow bob' + (conductor.follow ? " with your " + esc(conductor.follow) : "") + ".</p>";
    h += '<div class="row" style="gap:8px;">';
    h += '<button type="button" class="btn btn-accent" id="c-playpause" style="padding:8px 16px;font-size:13px;">' + (conductor.playing ? icon("pause", 16) + " Pause" : icon("play", 16) + " Play") + "</button>";
    h += '<button type="button" class="btn" id="c-restart" style="padding:8px 14px;font-size:13px;">' + icon("restart", 14) + " Restart</button>";
    h += "</div>";
    h += '<div class="row mt2" role="group" aria-label="Pivot movement" style="gap:6px;"><span class="ctl-label">Pivot</span>';
    ["grid", "circle", "3d"].forEach(function (m) {
      var label = m === "3d" ? "3D" : m.charAt(0).toUpperCase() + m.slice(1);
      h += '<button type="button" class="seg fd" data-pivot="' + m + '" aria-pressed="' + (conductor.pivotMode === m ? "true" : "false") + '" style="padding:6px 12px;font-size:12px;">' + label + "</button>";
    });
    h += "</div>";
    h += '<div class="row mt2"><label class="ctl-label" for="c-speed">Speed</label><input type="range" id="c-speed" min="0.1" max="1.5" step="0.1" value="' + conductor.speed + '" /><span class="ctl-val" id="c-speed-val">' + conductor.speed.toFixed(1) + "x</span></div>";
    h += '<div class="row mt1"><label class="ctl-label" for="c-chaos">Chaos</label><input type="range" id="c-chaos" min="1" max="10" step="1" value="' + conductor.chaos + '" /><span class="ctl-val" id="c-chaos-val">' + conductor.chaos + "</span></div>";
    h += '<div class="row mt1"><label class="ctl-label" for="c-count">Pendulums</label><input type="range" id="c-count" min="1" max="20" step="1" value="' + conductor.count + '" /><span class="ctl-val" id="c-count-val">' + conductor.count + "</span></div>";
    h += '<div class="row mt1"><label class="ctl-label" for="c-trail">Trail</label><input type="range" id="c-trail" min="10" max="140" step="10" value="' + conductor.trail + '" /><span class="ctl-val" id="c-trail-val">' + conductor.trail + "</span></div>";
    h += '<div class="row mt2"><label class="ctl-label" for="c-follow">Follow with</label>';

    });
    h += "</select></div>";
    h += "</section>";
  }
  h += "</div>";
  el.innerHTML = h;
  document.getElementById("c-edit").addEventListener("click", function () {

  document.getElementById("c-playpause-main").addEventListener("click", function () {
    conductor.playing = !conductor.playing;
    renderConductor();
    conductorStart();
  });
  if (!conductor.editOpen) return;
  document.getElementById("c-playpause").addEventListener("click", function () {
    conductor.playing = !conductor.playing;
    renderConductor();
    conductorStart();
  });
  document.getElementById("c-restart").addEventListener("click", function () {
    conductorReset();
    conductor.playing = true;
    renderConductor();
    conductorStart();
  });
  el.querySelectorAll("[data-pivot]").forEach(function (b) {
    b.addEventListener("click", function () {
      conductor.pivotMode = b.getAttribute("data-pivot");
      conductor.pendulums.forEach(function (pt) { pt.trail = []; });
      renderConductor();
      conductorStart();
    });
  });
  document.getElementById("c-speed").addEventListener("input", function (e) {
    conductor.speed = Number(e.target.value);
    document.getElementById("c-speed-val").textContent = conductor.speed.toFixed(1) + "x";
  });
  document.getElementById("c-chaos").addEventListener("input", function (e) {
    conductor.chaos = Number(e.target.value);
    document.getElementById("c-chaos-val").textContent = conductor.chaos;
    conductorReset();
  });
  document.getElementById("c-count").addEventListener("input", function (e) {
    conductor.count = Number(e.target.value);
    document.getElementById("c-count-val").textContent = conductor.count;
    conductorReset();
  });
  document.getElementById("c-trail").addEventListener("input", function (e) {
    conductor.trail = Number(e.target.value);
    document.getElementById("c-trail-val").textContent = conductor.trail;
  });
  document.getElementById("c-follow").addEventListener("change", function (e) {
    conductor.follow = e.target.value;
    renderConductor();
    conductorStart();
  });
}
function conductorPivotTarget(w, hgt) {
  var cx = w / 2, cy = hgt / 2;
  if (conductor.pivotMode === "circle") {
    var R = Math.min(w, hgt) * 0.22;
    return { x: cx + R * Math.cos(conductor.t * 0.4), y: cy + R * Math.sin(conductor.t * 0.4) };
  }
  if (conductor.pivotMode === "3d") {
    return { x: cx + w * 0.17 * Math.sin(conductor.t * 0.26), y: cy + hgt * 0.13 * Math.sin(conductor.t * 0.34 + 1.2) };
  }
  /* grid: hop cell to cell on the 4x3 grid */
  var col = conductor.gridIdx % 4;
  var row = Math.floor(conductor.gridIdx / 4) % 3;
  return { x: (col + 0.5) * (w / 4), y: (row + 0.5) * (hgt / 3) };
}
function conductorFrame(ts) {
  conductor.raf = null;
  if (state.tab !== "conductor") return;
  var canvas = document.getElementById("conductor-canvas");
  if (!canvas) return;
  var w = canvas.clientWidth, hgt = canvas.clientHeight;
  if (w === 0 || hgt === 0) { conductorStart(); return; }
  if (canvas.width !== w || canvas.height !== hgt) { canvas.width = w; canvas.height = hgt; }
  var ctx = canvas.getContext("2d");
  if (!ctx) return;
  var dtMs = conductor.lastTs ? Math.min(64, ts - conductor.lastTs) : 16;
  conductor.lastTs = ts;
  var dt = dtMs / 1000;

  if (conductor.playing) {
    conductor.t += dt;
    if (conductor.pivotMode === "grid") {
      conductor.gridTimer += dt;
      if (conductor.gridTimer > 2.8) {
        conductor.gridTimer = 0;
        conductor.gridIdx = (conductor.gridIdx + 1) % 12;
        conductor.pendulums.forEach(function (p) { p.trail = []; });
      }
    }
    var simDt = 0.016 * conductor.speed;
    var steps = Math.max(1, Math.round(conductor.speed * 2));
    conductor.pendulums.forEach(function (p) {
      for (var k = 0; k < steps; k++) pendulumStep(p, simDt / steps);
    });
  }
  var target = conductorPivotTarget(w, hgt);
  if (conductor.pivot.x === 0 && conductor.pivot.y === 0) { conductor.pivot.x = target.x; conductor.pivot.y = target.y; }
  var lerp = conductor.pivotMode === "grid" ? 0.045 : 1;
  conductor.pivot.x += (target.x - conductor.pivot.x) * lerp;
  conductor.pivot.y += (target.y - conductor.pivot.y) * lerp;
  var px = conductor.pivot.x, py = conductor.pivot.y;
  var L = Math.min(w, hgt) * 0.20;
  var phi = conductor.pivotMode === "3d" ? conductor.t * 0.3 : 0;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, hgt);
  /* pivot path guides */
  ctx.strokeStyle = "rgba(164,156,174,0.28)";
  ctx.lineWidth = 1;
  if (conductor.pivotMode === "grid") {
    ctx.beginPath();
    for (var gx = 1; gx < 4; gx++) { ctx.moveTo(gx * w / 4, 0); ctx.lineTo(gx * w / 4, hgt); }
    for (var gy = 1; gy < 3; gy++) { ctx.moveTo(0, gy * hgt / 3); ctx.lineTo(w, gy * hgt / 3); }
    ctx.stroke();
    ctx.fillStyle = "rgba(164,156,174,0.4)";
    for (var cx2 = 0; cx2 < 4; cx2++) for (var cy2 = 0; cy2 < 3; cy2++) {
      ctx.beginPath(); ctx.arc((cx2 + 0.5) * w / 4, (cy2 + 0.5) * hgt / 3, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (conductor.pivotMode === "circle") {
    ctx.beginPath();
    ctx.arc(w / 2, hgt / 2, Math.min(w, hgt) * 0.22, 0, Math.PI * 2);
    ctx.stroke();
  }
  function project(x, y) {
    if (conductor.pivotMode !== "3d") return { x: px + x, y: py + y, s: 1 };
    var c = Math.cos(phi), sn = Math.sin(phi);
    return { x: px + x * c, y: py + y - x * sn * 0.38, s: 1 - 0.28 * sn * (x / (L * 2)) };
  }
  conductor.pendulums.forEach(function (p, i) {
    var x1 = L * Math.sin(p.a1), y1 = L * Math.cos(p.a1);
    var x2 = x1 + L * Math.sin(p.a2), y2 = y1 + L * Math.cos(p.a2);
    var b1 = project(x1, y1), b2 = project(x2, y2);
    if (conductor.playing) {
      p.trail.push({ x: b2.x, y: b2.y });
      while (p.trail.length > conductor.trail) p.trail.shift();
    }
    var hue = Math.round((i * 360 / Math.max(1, conductor.pendulums.length) + 160) % 360);
    var color = "hsl(" + hue + ", 85%, 62%)";
    if (p.trail.length > 1) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2;
      ctx.beginPath();
      p.trail.forEach(function (pt, j) { if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(245,239,232,0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(b1.x, b1.y, 3.5 * b1.s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(b2.x, b2.y, 5 * b2.s, 0, Math.PI * 2); ctx.fill();
  });
  /* the lead bob: big, yellow, the one to follow */
  var lead = conductor.pendulums[0];
  if (lead) {
    var lx1 = L * Math.sin(lead.a1), ly1 = L * Math.cos(lead.a1);
    var lx2 = lx1 + L * Math.sin(lead.a2), ly2 = ly1 + L * Math.cos(lead.a2);
    var lb = project(lx2, ly2);
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath(); ctx.arc(lb.x, lb.y, 13 * lb.s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,210,63,0.45)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lb.x, lb.y, 19 * lb.s, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = "#f5efe8";
  ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
  conductorStart();
}
function conductorStart() {
  if (state.tab !== "conductor") return;
  if (conductor.raf === null) conductor.raf = requestAnimationFrame(conductorFrame);
}
function conductorStop() {
  if (conductor.raf !== null) { cancelAnimationFrame(conductor.raf); conductor.raf = null; }
  conductor.lastTs = 0;
}

/* --------------------------- tabs + init ----------------------------- */
function switchTab(tab) {
  state.tab = tab;
  ["timer", "notes", "labs", "party", "conductor"].forEach(function (t) {
    document.getElementById("view-" + t).hidden = t !== tab;
  });
  document.getElementById("timer-footer").hidden = tab !== "timer";
  document.querySelectorAll("#tabbar [data-tab]").forEach(function (b) {
    b.setAttribute("aria-selected", b.getAttribute("data-tab") === tab ? "true" : "false");
  });
  /* Cross-tab data (note↔lab links, tags) refreshes on entry, so a
     note tagged on the Notes tab counts on its lab card right away. */
  if (tab === "labs") renderLabs();
  if (tab === "notes") renderNotes();
  /* A running session keeps the bottom nav: tapping away auto-pauses
     it and it steps aside; tapping Timer brings it back, still paused,
     with Resume. Closing it (the X) is the only way it ends early. */
  if (session.active) {
    if (tab !== "timer") {
      if (session.running) session.pauseNow();
      session.away = true;
      document.getElementById("session").hidden = true;
      roundsFx.stop();
    } else {
      session.away = false;
      document.getElementById("session").hidden = false;
      renderSession();
    }
  }
  if (tab === "conductor") conductorStart();
  else conductorStop();
}
