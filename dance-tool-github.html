      .overlay[hidden] { display: none; }

      .stage-top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 0; }
      .stage-bottom { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62dvh; overflow-y: auto; padding: 0 16px max(20px, env(safe-area-inset-bottom)); }
      .stage-title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.6); margin: 4px 0 0; }

      .note-pre { white-space: pre-wrap; overflow-wrap: break-word; font-size: 20px; line-height: normal; font-family: inherit; margin: 10px 0 0; }

      /* ================= updates: shared sizes, toast, modal, notes, conductor, rounds ================= */
      :root { --break-bg: #0e2138; --break: #57b7ff; --tag: #57b7ff; }
      /* One standard large-button size (48px) for every big commit action. */
      .btn-lg { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 12px 20px; font-family: "Archivo", system-ui, sans-serif; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; border: 1px solid transparent; }
      .btn-lg:disabled { opacity: 0.4; }
      .btn-lg-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn-lg-volt { background: var(--volt); border-color: var(--volt); color: #000; }
      .btn-lg-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
      .btn-lg-outline-volt { background: transparent; border: 2px solid var(--volt); color: var(--volt); }
      /* Timer footer hierarchy: mode buttons 44px, time pills 13px. */
      #timer-footer .seg { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
      #timer-footer .minchip { font-size: 13px; padding: 8px 14px; line-height: 1; }
      /* Slot shuffle / remove / category-plus: one true 38px round control. */
      .slot-act { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex: none; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--dim); }
      .slot-act.volt { color: var(--volt); }
      /* Ephemeral toast */
      #toast { position: fixed; left: 0; right: 0; top: max(12px, env(safe-area-inset-top)); z-index: 90; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
      #toast[hidden] { display: none; }
      #toast .pill { font-family: "Archivo", system-ui, sans-serif; border: 1px solid rgba(255,210,63,0.6); background: var(--surface); color: var(--volt); border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 700; text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
      /* The one confirm modal */
      #modal-root { position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); padding: 0 16px; }
      #modal-root[hidden] { display: none; }
      .modal-card { width: 100%; max-width: 384px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
      .modal-title { font-size: 20px; font-weight: 900; line-height: 1.2; margin: 0; }
      .modal-body { font-size: 14px; color: var(--dim); margin: 6px 0 0; }
      .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
      .modal-actions .btn { flex: 1; padding: 10px 16px; font-size: 14px; }
      /* Session stops above the tab bar: nav stays visible; tapping away pauses. */
      #session { bottom: calc(48px + max(4px, env(safe-area-inset-bottom))); }
      #session.break { background: var(--break-bg); }
      .rounds-particles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .break-big { font-size: 44px; font-weight: 900; line-height: 1.02; color: var(--break); overflow-wrap: break-word; margin: 12px 0 0; font-variant-numeric: tabular-nums; }
      /* Notes: one search-and-filter panel above the list */
      #view-notes { position: relative; }
      /* The Notes list is a column: the search/filter panel sits on
         top and the results scroll in their own box beneath it, so
         the panel can never ride over the list or its headings. */
      #view-notes.notes-list-mode { display: flex; flex-direction: column; overflow: hidden; }
      #view-notes.notes-list-mode[hidden] { display: none; }
      .notes-sticky { flex: none; }
      .notes-results-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-top: 16px; }
      .notes-filter { padding: 12px; }
      .search-wrap { position: relative; }
      .search-wrap .search-ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; display: inline-flex; }
      .search-input { width: 100%; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 12px 38px 12px 40px; font-size: 16px; line-height: normal; }
      .search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: inline-flex; padding: 6px; color: var(--dim); }
      .search-clear[hidden] { display: none; }
      .all-tags-row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-top: 10px; -webkit-overflow-scrolling: touch; }
      /* Tags are blue everywhere — outline, text and a translucent
         fill — so a tag never reads as a button. Active = filled. */
      .tagchip { display: inline-flex; align-items: center; gap: 4px; flex: none; white-space: nowrap; border-radius: 999px; border: 1px solid rgba(87,183,255,0.5); background: rgba(87,183,255,0.12); padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--tag); }
      .tagchip[aria-pressed="true"] { background: var(--tag); border-color: var(--tag); color: #000; }
      .tagchip .xbtn { display: inline-flex; margin-right: -4px; padding: 2px; color: inherit; }
      .suggchip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 1px dashed rgba(255,77,46,0.6); padding: 4px 10px; font-size: 12px; font-weight: 700; color: var(--accent); background: none; }
      .note-card { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 12px 16px; }
      .note-card + .note-card { margin-top: 8px; }
      .note-excerpt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: break-word; text-align: left; }
      /* Tag autocomplete */
      .taged { position: relative; }
      .tag-input { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 10px 12px; font-size: 16px; line-height: normal; }
      /* The dropdown is positioned with position:fixed against the
         VISUAL viewport (see positionTagDrop): with the iPhone

         keyboard or its accessory bar. */
      .tag-drop { position: fixed; left: 0; right: auto; z-index: 80; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-alt); box-shadow: 0 20px 48px rgba(0,0,0,0.5); }
      .tag-drop button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; text-align: left; font-size: 16px; }
      .tag-drop .hint { flex: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
      .tag-drop .newrow { color: var(--volt); font-weight: 600; justify-content: flex-start; }
      /* Note editor inputs: plain native styling, normal leading — the iOS caret rule. */
      .note-body-input { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 12px 14px; font-size: 18px; line-height: normal; font-family: inherit; }
      .note-body-edit { font-size: 20px; }
      /* New-note save bar: pinned just above the tab bar, two half-width buttons. */
      #note-savebar { position: fixed; left: 0; right: 0; z-index: 35; border-top: 1px solid var(--border); background: rgba(13,11,16,0.95); backdrop-filter: blur(8px); bottom: calc(48px + max(4px, env(safe-area-inset-bottom))); }
      #note-savebar .inner { max-width: 768px; margin: 0 auto; display: flex; gap: 8px; padding: 10px 12px; }
      #note-savebar .btn-lg { flex: 1; }
      /* Floating plus fan (plain tap) */
      #notes-fan { position: fixed; right: 16px; bottom: 84px; z-index: 45; display: flex; flex-direction: column; align-items: flex-end; }
      #notes-fan .fan-main { display: flex; width: 64px; height: 64px; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent); color: #fff; box-shadow: 0 16px 40px rgba(0,0,0,0.5); touch-action: manipulation; -webkit-touch-callout: none; user-select: none; }
      #notes-fan .fan-opt { display: flex; align-items: center; gap: 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 6px 16px 6px 6px; font-size: 14px; font-weight: 700; box-shadow: 0 12px 32px rgba(0,0,0,0.4); margin-bottom: 10px; }
      #notes-fan .fan-opt .oi { display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; flex: none; }
      #fan-backdrop { position: fixed; inset: 0; z-index: 44; background: rgba(0,0,0,0.5); }
      /* Conductor: full-bleed visualizer, controls behind the edit icon */
      #view-conductor { padding: 0; max-width: none; overflow: hidden; }
      .conductor-wrap { position: relative; height: calc(100dvh - 62px); min-height: 430px; background: #000; }
      .conductor-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .conductor-play { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent); color: #fff; box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 3; }
      .conductor-edit { position: absolute; bottom: calc(60px + max(4px, env(safe-area-inset-bottom))); right: 16px; display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--border); background: rgba(13,11,16,0.85); color: var(--text); box-shadow: 0 12px 32px rgba(0,0,0,0.4); backdrop-filter: blur(6px); z-index: 3; }
      .conductor-panel { position: absolute; left: 12px; right: 12px; top: auto; bottom: calc(132px + max(4px, env(safe-area-inset-bottom))); z-index: 4; max-height: calc(100% - 176px); overflow-y: auto; border-radius: var(--radius); border: 1px solid var(--border); background: rgba(13,11,16,0.95); backdrop-filter: blur(8px); padding: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
      .conductor-panel input[type="range"] { flex: 1; min-width: 0; accent-color: var(--volt); }
      #tabbar button:disabled { opacity: 0.35; }

      /* ================= batch 3 + 4 sync with the sidebar tool (2026-11-09) ================= */
      :root { --overlay: #2c2635; }
      /* Pressed state: every button dips and brightens while pushed. */
      button { -webkit-tap-highlight-color: transparent; }
      button:not(:disabled) { transition: transform 90ms ease-out, filter 90ms ease-out; }
      button:not(:disabled):active { transform: scale(0.95); filter: brightness(1.35); }
      .conductor-play:active { transform: translateX(-50%) scale(0.95); }
      .stage-play:active { transform: translate(-50%, -50%) scale(0.95); }
      .search-clear:active { transform: translateY(-50%) scale(0.95); }
      @media (prefers-reduced-motion: reduce) {
        button:not(:disabled) { transition: none; }
        button:not(:disabled):active { transform: none; }
      }
      /* Icon buttons: one standard size — 40px circle, 20px Tabler icon;
         the small one is 32px / 16px for compact rows. */
      .iconbtn { width: 40px; height: 40px; padding: 0 !important; }
      .iconbtn > svg.ic { width: 20px; height: 20px; }
      .iconbtn.sm { width: 32px; height: 32px; }
      .iconbtn.sm > svg.ic { width: 16px; height: 16px; }
      /* Slot actions (shuffle / remove / new-category +) run smaller
         than the standard icon button: 32px circle, 16px icon. */
      .slot-act { width: 32px; height: 32px; }
      .slot-act > svg.ic { width: 16px; height: 16px; }
      .stepper { width: 32px; height: 32px; padding: 0; }
      .stepper > svg.ic { width: 16px; height: 16px; }
      /* Large-button text is 14px so pairs sit side by side. */
      .btn-lg { font-size: 14px; }
      #note-savebar .btn-lg { white-space: nowrap; }
      /* One flat Overlay style for toasts, the modal, the tag dropdown
         and the Conductor panel: the border color as background, no
         border, no shadow. Toast text is volt. */
      #toast .pill { background: var(--overlay); border: none; box-shadow: none; color: var(--volt); }
      .modal-card { background: var(--overlay); border: none; box-shadow: none; }
      .modal-actions .btn-lg { flex: 1; }
      .tag-drop { background: var(--overlay); border: none; box-shadow: none; }
      .conductor-panel { background: var(--overlay); border: none; box-shadow: none; backdrop-filter: none; }
      /* Toast fades: quick in, quick out. */
      @keyframes toastfade { 0% { opacity: 0; } 5% { opacity: 1; } 91% { opacity: 1; } 100% { opacity: 0; } }
      .toast-anim { animation: toastfade 3s ease-in-out forwards; }
      @media (prefers-reduced-motion: reduce) { .toast-anim { animation: none; } }
      /* Sideways chip rows scroll with no visible scrollbar. */
      .no-scrollbar, .all-tags-row, .aspect-row { scrollbar-width: none; -ms-overflow-style: none; }
      .no-scrollbar::-webkit-scrollbar, .all-tags-row::-webkit-scrollbar, .aspect-row::-webkit-scrollbar { display: none; }
      /* Keyboard clearance: a focused field scrolls clear of the
         keyboard and the floating accessory bar above it. */
      input, textarea, select { scroll-margin-bottom: 9rem; }
      /* The Timer's sticky footer sits on the elevated surface color. */
      #timer-footer { background: var(--surface); }
      /* One clock size across Layered, In turn and Rounds. */
      .session-clock { font-size: 60px; }
      /* Session transport: prev / pause / next on one line, Lab N of M under it. */
      .transport-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 28px; }
      .skipbtn { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex: none; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); }
      .skipbtn:disabled { opacity: 0.35; }
      .lab-of { margin: 8px 0 0; text-align: center; font-size: 14px; font-weight: 700; color: var(--dim); }
      /* Notes inside a lab: small note-boxes — slightly rounded
         rectangles in the note colors, never tag pills. */
      .lab-note-box { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 8px 12px; text-align: left; }
      .lab-note-box + .lab-note-box { margin-top: 6px; }
      .lab-note-box .t { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lab-note-box .g { display: block; font-size: 12px; color: var(--dim); }
      .lab-note-box > svg.ic { flex: none; color: var(--dim); }
      /* Export dropdown beside the Your labs title. */
      .export-wrap { position: relative; flex: none; }
      .export-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 224px; border-radius: var(--radius); background: var(--overlay); padding: 6px; }
      .export-menu button { display: flex; width: 100%; align-items: center; gap: 8px; border-radius: 8px; padding: 10px 12px; text-align: left; font-family: "Archivo", system-ui, sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text); }
      .export-menu button:disabled { opacity: 0.4; }
      .export-backdrop { position: fixed; inset: 0; z-index: 20; cursor: default; }
      .aspect-row { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; -webkit-overflow-scrolling: touch; }
      /* Conductor: fixed to the viewport, edge to edge; the play/pause
         floats centered just above the tab bar. */
      .conductor-wrap { position: fixed; inset: 0; height: auto; min-height: 0; z-index: 25; }
      .conductor-play { bottom: calc(60px + max(4px, env(safe-area-inset-bottom))); box-shadow: none; }
      /* The edit button sits bottom-right, level with play/pause;
         its panel opens as a sheet at the bottom, above the pause
         button, and tapping anywhere outside closes it (every
         control applies its change as it's moved). */
      .conductor-edit { width: 40px; height: 40px; box-shadow: none; top: auto; bottom: calc(60px + max(4px, env(safe-area-inset-bottom))); right: 16px; }
      .conductor-backdrop { position: absolute; inset: 0; z-index: 2; background: transparent; cursor: default; }
      .conductor-edit > svg.ic { width: 20px; height: 20px; }
      #tabbar { position: relative; z-index: 40; }
      /* Category rows expand to their items. */
      .cat-item-box { display: inline-block; border: 1px solid var(--border); background: var(--bg); border-radius: 6px; padding: 4px 8px; font-size: 14px; }

      /* ================= iPhone safe areas (2026-11-09) =================
         The page draws under the status bar / notch (viewport-fit=cover
         + a translucent status bar in the home-screen app), so the app
         column starts below the top inset — before this, the first
         screen of every tab slid under the clock. The insets are 0 in
         the Muse shell frame and on desktop, so nothing moves there.
         Height: 100dvh measured short of the real screen in the
         home-screen app, leaving the tab bar floating above a black
         gap; the html/body 100% chain fills the actual screen in both
         the app and the shell, so it wins and dvh stays as the first
         fallback for anything that can't resolve the chain. */
      #app { height: 100dvh; height: 100%; padding-top: env(safe-area-inset-top, 0px); }
      /* The running session is a fixed overlay: its content starts
         below the notch too. */
      .session-inner { padding-top: max(12px, env(safe-area-inset-top, 0px)); }
      /* The floating plus keeps the same clearance above the tab bar,
         which grows by the home-indicator inset on notched phones. */
      #notes-fan { bottom: calc(72px + max(4px, env(safe-area-inset-bottom, 0px))); }
      /* The Notes list no longer scrolls under its filter panel at
         all — see the notes-list-mode column layout above. */
      /* Center-alignment pass: large buttons center their label (the
         Labs pair wrapped "Send to Timer" onto two lines and read
         off-center next to one-line "Save lab" — the pair now stays
         on one line, icon and label centered as a group). */
      .btn-lg { text-align: center; }
      .btn-lg-pair { padding-left: 10px; padding-right: 10px; font-size: 13px; white-space: nowrap; min-width: 0; }
      .btn-lg-pair > svg.ic { flex: none; }
      .btn-lg-pair + .btn-lg-pair, .btn-lg-pair + .btn-lg, .btn-lg + .btn-lg-pair { min-width: 0; }
    </style>

              <div class="row" role="group" aria-label="What to drill" style="gap: 6px;">
                <button type="button" class="seg fd" id="src-lab" aria-pressed="true">Saved lab</button>
                <button type="button" class="seg fd" id="src-quick" aria-pressed="false">Create lab</button>
              </div>
            </div>
            <div class="picker-scroll" id="picker-body"></div>
            <div id="picker-add"></div>
          </section>

          <div class="today-wrap">
            <section class="card" aria-label="Today's drills">
              <button type="button" class="today-bar" id="today-bar" aria-expanded="false"></button>
            </section>
            <div class="today-panel" id="today-panel" hidden></div>
          </div>

        <!-- ============================ NOTES ============================ -->

        <main id="view-labs" class="view" aria-label="Labs" hidden></main>

        <!-- ============================ PARTY ============================ -->
        <main id="view-party" class="view" aria-label="Party" hidden></main>

        <!-- ========================== CONDUCTOR ========================== -->
        <main id="view-conductor" class="view" aria-label="Conductor" hidden></main>
      </div>

      <div id="timer-footer" aria-label="Practice mode and start"><div class="inner" id="timer-footer-inner"></div></div>

            Timer

            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v6.343M14 2v6.343M10 8.343L5.789 15.58A2 2 0 0 0 7.526 18.5h8.948a2 2 0 0 0 1.737 -2.92L14 8.343" /><path d="M8.5 2h7" /><path d="M7 16h10" /></svg>

            Notes
          </button>
          <button type="button" role="tab" data-tab="party" aria-selected="false" disabled aria-disabled="true">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M9 17V4h10v13" /><path d="M9 8h10" /></svg>
            Party
          </button>
          <button type="button" role="tab" data-tab="conductor" aria-selected="false">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21l15 -15l-3 -3L3 18l3 3z" /><path d="M15 6l3 3" /><path d="M9 3.5l.6 1.7L11.3 5.8l-1.7.6L9 8.1l-.6 -1.7L6.7 5.8l1.7 -.6z" /></svg>
            Conductor

        </div>
      </nav>
    </div>

    <!-- Practice session (Together / In turn) -->
    <div id="session" class="overlay" role="dialog" aria-modal="true" hidden></div>

function storeGet(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (raw === null) return fallback;
    var v = JSON.parse(raw);
    return v === null || v === undefined ? fallback : v;
  } catch (e) { return fallback; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode etc. — state still works for the session */ }
}

/* One-time seed heal: a browser that ran an older copy can hold empty
   notes / tags in storage from before the baked-in seed existed, and a
   stored empty value wins over the seed forever — the Notes list then
   shows no "My notes" group, no tag chips on cards, and no tag filter
   row under the search bar (exactly the stale look reported from the
   home-screen copy). Merge any missing seed notes, tags and hidden
   entries in once; after that this browser's own data rules,
   deletions included. */
(function healSeedOnce() {
  var FLAG = "danceTool.seeded.v2";
  try { if (window.localStorage.getItem(FLAG)) return; } catch (e) { return; }
  if (DATA) {
    var seedNotes = DATA.userNotes || [];
    if (seedNotes.length) {
      var have = {};
      state.userNotes.forEach(function (n) { have[String(n.id)] = true; });
      var missing = seedNotes.filter(function (n) { return !have[String(n.id)]; });
      if (missing.length) {
        state.userNotes = state.userNotes.concat(missing);
        storeSet(LS_NOTES, state.userNotes);
      }
    }
    var seedTags = DATA.noteTags || {};
    var tagsChanged = false;
    Object.keys(seedTags).forEach(function (key) {
      var cur = (state.noteTags[key] || []).slice();
      (seedTags[key] || []).forEach(function (t) {
        if (cur.indexOf(t) === -1) { cur.push(t); tagsChanged = true; }
      });
      if (cur.length) state.noteTags[key] = cur;
    });
    if (tagsChanged) storeSet(LS_NOTETAGS, state.noteTags);
    var hiddenChanged = false;
    (DATA.hiddenNotes || []).forEach(function (k) {
      if (state.hiddenNotes.indexOf(k) === -1) { state.hiddenNotes.push(k); hiddenChanged = true; }
    });
    if (hiddenChanged) storeSet(LS_HIDDEN_NOTES, state.hiddenNotes);
  }
  try { window.localStorage.setItem(FLAG, "1"); } catch (e) { /* private mode — heal simply runs again next open */ }
})();

/* --------------------------- catalog merge --------------------------- */
function effectiveCategories() {
  var baked = (DATA && DATA.customItems) || {};
  return DATA.categories.map(function (c) {
    var seen = {};
    var items = [];
    function push(it) {
      var k = String(it).toLowerCase();
      if (!seen[k]) { seen[k] = true; items.push(it); }
    }
    c.items.forEach(push);
    (baked[c.name] || []).forEach(push);
    (state.customItems[c.name] || []).forEach(push);
    return { name: c.name, items: items };
  }).concat((state.customCategories || []).filter(function (cc) {
    return !DATA.categories.some(function (c) { return c.name.toLowerCase() === String(cc.name).toLowerCase(); });
  }).map(function (cc) {
    var seen = {};
    var items = [];
    (state.customItems[cc.name] || []).forEach(function (it) {
      var k = String(it).toLowerCase();
      if (!seen[k]) { seen[k] = true; items.push(it); }
    });
    return { name: cc.name, items: items };
  }));
}
function addCustomCategory(name) {
  var cats = effectiveCategories();
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].name.toLowerCase() === name.toLowerCase()) return cats[i].name;
  }
  state.customCategories.push({ name: name });
  storeSet(LS_CATS, state.customCategories);
  return name;
}
function addCategoryItem(category, item) {
  var cats = effectiveCategories();
  var cat = null;
  for (var i = 0; i < cats.length; i++) if (cats[i].name === category) cat = cats[i];
  if (!cat) return false;
  var lower = item.toLowerCase();
  for (var j = 0; j < cat.items.length; j++) if (cat.items[j].toLowerCase() === lower) return false;
  if (!state.customItems[category]) state.customItems[category] = [];
  state.customItems[category].push(item);
  storeSet(LS_ITEMS, state.customItems);
  return true;
}

/* ------------------------------ labs --------------------------------- */
function labSignature(lab) {
  return (lab.pairs || []).map(function (p) { return p.category + "" + p.item; }).join("|") + "#" + (lab.name || "");
}
function allLabs() {
  var out = [];
  var seen = {};
  state.bakedLabs.forEach(function (l) {
    var lab = { id: "baked-" + out.length, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: true, createdAt: null };
    var sig = labSignature(lab);
    if (state.hiddenBaked.indexOf(sig) !== -1) return;
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  state.localLabs.forEach(function (l) {
    var lab = { id: l.id, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: false, createdAt: l.createdAt || null };
    var sig = labSignature(lab);
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  return out;
}
function pairsForLab(lab) {
  if (lab.pairs && lab.pairs.length > 0) return lab.pairs;
  return (lab.moves || []).map(function (item) {
    return { category: lab.source === "party" ? "Party steps" : "Lab", item: item };
  });
}
function labName(pairs) {
  return pairs.map(function (p) { return p.item ? p.item : "Random " + p.category; }).join(" · ") || "Lab";
}
/* The pairs a set of slots stands for right now: a chosen category with
   no item stays random (item ""); a slot with no category rolls a
   concrete category + item. */
function snapshotPairs(slots) {
  var categories = effectiveCategories();
  return slots.map(function (slot) {
    if (slot.category) return { category: slot.category, item: slot.item || "" };
    var cat = pickRandom(categories);
    if (!cat) return { category: "Freestyle", item: "Free choice" };
    return { category: cat.name, item: pickRandom(cat.items) || "Free choice" };
  });
}
/* Roll every random slot fresh for a session start — fixed picks stay,
   and a rolled item never repeats another item from its category. */
function resolveForSession(pairs) {
  var cats = effectiveCategories();
  var byName = {};
  cats.forEach(function (c) { byName[c.name] = c.items; });
  var used = {};
  pairs.forEach(function (p) {
    if (p.item) { if (!used[p.category]) used[p.category] = {}; used[p.category][p.item] = true; }
  });
  return pairs.map(function (p) {
    if (p.item) return { category: p.category, item: p.item, rolled: false };
    var all = byName[p.category] || [];
    if (!used[p.category]) used[p.category] = {};
    var open = all.filter(function (it) { return !used[p.category][it]; });
    var item = pickRandom(open.length ? open : all);
    if (item) used[p.category][item] = true;
    /* A rolled slot is labeled "Random <Category>" above the name it
       rolled when the session runs. */
    return { category: p.category, item: item || "Free choice", rolled: true };
  });
}
function findLab(id) {
  var labs = allLabs();
  for (var i = 0; i < labs.length; i++) if (labs[i].id === id) return labs[i];
  return null;
}

        state.drills.push({ id: newId("drill"), name: effectiveName, pairs: clean });
        queue.onDrillsChanged();
      }
      showToast("Sent — it's queued in Today on the Timer.");
      renderLabsYourLab();
    });
  }
  var cancelBtn = document.getElementById("labs-cancel-edit");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", function () {
      state.editingLabId = null;
      state.labsName = "";
      state.labsEditNoteSearch = "";
      pickers.labs.slots = [newSlot("", "")];
      renderLabs();
    });
  }
  var noteSearch = document.getElementById("labs-edit-note-search");
  if (noteSearch && editing) {
    noteSearch.addEventListener("input", function (e) {
      state.labsEditNoteSearch = e.target.value;
      renderLabsEditNotesList(editing);
    });
    renderLabsEditNotesList(editing);
  }
}
function renderLabsEditNotesList(lab) {
  var host = document.getElementById("labs-edit-notes-list");
  if (!host || !lab) return;
  var labNameStr = lab.name || labName(pairsForLab(lab));
  var q = state.labsEditNoteSearch.trim().toLowerCase();
  var notes = allUnifiedNotes().filter(function (n) {
    return !q || n.title.toLowerCase().indexOf(q) !== -1 || n.body.toLowerCase().indexOf(q) !== -1;
  });
  if (notes.length === 0) {
    host.innerHTML = '<p class="dim small" style="margin:0;">No notes match that.</p>';
    return;
  }
  host.innerHTML = notes.map(function (n) {
    var attached = (state.noteLabLinks[n.key] || []).indexOf(labNameStr) !== -1;
    return '<button type="button" class="btn" data-labnote="' + esc(n.key) + '" aria-pressed="' + (attached ? "true" : "false") + '" style="display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;margin-top:6px;padding:8px 12px;border-radius:8px;' + (attached ? "border-color:rgba(255,210,63,0.6);background:rgba(255,210,63,0.1);color:var(--volt);" : "") + '"><span style="min-width:0;overflow-wrap:break-word;">' + esc(n.title) + ' <span class="dim" style="font-weight:400;">· ' + esc(n.group) + "</span></span>" + (attached ? icon("check", 16) : "") + "</button>";
  }).join("");
  host.querySelectorAll("[data-labnote]").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.getAttribute("data-labnote");
      var links = (state.noteLabLinks[key] || []).slice();
      var at = links.indexOf(labNameStr);
      if (at === -1) links.push(labNameStr); else links.splice(at, 1);
      if (links.length) state.noteLabLinks[key] = links; else delete state.noteLabLinks[key];
      storeSet(LS_NOTELINKS, state.noteLabLinks);
      renderLabsEditNotesList(lab);
      renderLabsList();
    });
  });
}
function renderLabsList() {
  var el = document.getElementById("labs-list");
  if (!el) return;
  var labs = allLabs();
  if (labs.length === 0) {
    el.innerHTML = '<p class="dim base">No labs yet — build one above and save it.</p>';
    return;
  }
  if (!state.labNotesOpen) state.labNotesOpen = {};
  el.innerHTML = labs.map(function (lab) {
    var pairs = pairsForLab(lab);
    var name = lab.name || labName(pairs);
    var noteKeys = labNoteKeys(lab);
    var notesOpen = !!state.labNotesOpen[lab.id];
    var h = '<article class="card lab-card" aria-label="Lab ' + esc(name) + '">';
    /* Edit sits at the top right of the block; the meta line under
       the name is just the date — no item count. */
    h += '<div class="row" style="justify-content:space-between;align-items:flex-start;">';
    h += '<h3 class="fd" style="font-size:18px;font-weight:900;margin:0;padding-top:8px;overflow-wrap:break-word;">' + esc(name) + "</h3>";
    h += '<button type="button" class="iconbtn" data-lab-edit="' + esc(lab.id) + '" title="Edit" aria-label="Edit lab ' + esc(name) + '">' + icon("pencil", 20) + "</button>";
    h += "</div>";
    if (lab.createdAt) {
      h += '<p class="dim small" style="margin:2px 0 0;">' + esc(new Date(lab.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })) + "</p>";
    }
    /* Just the items, no category labels — the sidebar dropped
       them as redundant (the lab's name already says what it is). */
    h += '<div class="mt2" style="display:grid;gap:4px;">';
    pairs.forEach(function (pr) {
      h += '<p style="margin:0;font-size:15px;line-height:1.35;"><span style="font-weight:600;">' + esc(pairLabel(pr)) + "</span></p>";
    });
    h += "</div>";
    /* One Notes row per card, always shown — even at zero notes.
       Tapping it opens the lab's notes; Add note sits at the top of
       that list. There is no separate Add note button. */
    h += '<div class="mt3">';
    h += '<button type="button" class="btn" data-lab-notes="' + esc(lab.id) + '" aria-expanded="' + (notesOpen ? "true" : "false") + '" aria-label="' + (notesOpen ? "Hide" : "Show") + ' the ' + noteKeys.length + ' notes for lab ' + esc(name) + '" style="padding:6px 12px;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:var(--dim);">' + icon("note", 14) + ' Notes · ' + noteKeys.length + " " + (notesOpen ? icon("chevU", 14) : icon("chevD", 14)) + "</button>";
    if (notesOpen) {
      h += '<div class="mt2">';
      h += '<button type="button" class="btn" data-lab-addnote="' + esc(lab.id) + '" aria-label="Add a note to lab ' + esc(name) + ' — its items start as the note\'s tags" style="border-color:rgba(255,210,63,0.6);color:var(--volt);padding:8px 16px;font-weight:700;">' + icon("note", 16) + " Add note</button>";
      if (noteKeys.length > 0) {
        /* Notes read as notes here: small note-boxes with the note's
           first line and its group — the same look as the Notes
           area, a little smaller — never yellow tag pills. */
        h += '<div class="mt2">';
        noteKeys.forEach(function (key) {
          var n = findUnifiedNote(key);
          if (!n) return;
          h += '<button type="button" class="lab-note-box" data-lab-open-note="' + esc(key) + '" aria-label="Open note for this lab: ' + esc(n.title) + '"><span style="min-width:0;"><span class="t">' + esc(n.title) + '</span><span class="g">' + esc(n.group) + "</span></span>" + icon("chevR", 16) + "</button>";
        });
        h += "</div>";
      } else {
        h += '<p class="dim small mt2" style="margin-bottom:0;">No notes for this lab yet.</p>';
      }
      h += "</div>";
    }
    h += "</div>";
    /* Bottom row: the icon buttons (Duplicate, Delete) align left,
       Practice aligns right. The old per-card Timer button is gone. */
    h += '<div class="lab-actions" style="align-items:center;">';
    h += '<button type="button" class="iconbtn" data-lab-dup="' + esc(lab.id) + '" title="Duplicate" aria-label="Duplicate ' + esc(name) + '">' + icon("copy", 20) + "</button>";
    h += '<button type="button" class="iconbtn" data-lab-del="' + esc(lab.id) + '" title="Delete" aria-label="Delete ' + esc(name) + '">' + icon("trash", 20) + "</button>";
    h += '<button type="button" class="btn btn-accent" data-lab-practice="' + esc(lab.id) + '" style="margin-left:auto;padding:7px 14px;font-size:13px;">' + icon("play", 20) + " Practice</button>";
    h += "</div></article>";
    return h;
  }).join("");
  el.querySelectorAll("[data-lab-notes]").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-lab-notes");
      state.labNotesOpen[id] = !state.labNotesOpen[id];
      renderLabsList();
    });
  });
  el.querySelectorAll("[data-lab-addnote]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-addnote"));
      if (!lab) return;
      var seen = {};
      var tags = [];
      pairsForLab(lab).forEach(function (pr) {
        var t = pairLabel(pr);
        var k = t.toLowerCase();
        if (!seen[k]) { seen[k] = true; tags.push(t); }
      });
      openNoteWriter(tags, "labs");
    });
  });
  el.querySelectorAll("[data-lab-open-note]").forEach(function (b) {
    b.addEventListener("click", function () { openNoteDetail(b.getAttribute("data-lab-open-note")); });
  });
  el.querySelectorAll("[data-lab-practice]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-practice"));
      if (!lab) return;
      state.selectedLabId = lab.id;
      state.source = "lab";
      switchTab("timer");
      renderPicker();
      document.getElementById("view-timer").scrollTop = 0;
    });
  });
  el.querySelectorAll("[data-lab-edit]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-edit"));
      if (!lab) return;
      var pairs = pairsForLab(lab);
      pickers.labs.slots = pairs.map(function (pr) { return newSlot(pr.category, pr.item); });
      if (pickers.labs.slots.length === 0) pickers.labs.slots = [newSlot("", "")];
      state.editingLabId = lab.id;
      state.labsName = lab.name || "";
      state.labsEditNoteSearch = "";
      renderLabs();
      document.getElementById("view-labs").scrollTop = 0;
    });
  });
  el.querySelectorAll("[data-lab-dup]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-dup"));
      if (!lab) return;
      var pairs = pairsForLab(lab).map(function (pr) { return { category: pr.category, item: pr.item || "" }; });
      saveLocalLab((lab.name || labName(pairs)) + " copy", pairs, lab.source || "", { allowDuplicate: true });
      renderLabsList();
      updateLabsLabel();
      showToast("Duplicated — the copy is in your labs.");
    });
  });
  el.querySelectorAll("[data-lab-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      var lab = findLab(b.getAttribute("data-lab-del"));
      if (!lab) return;
      var name = lab.name || labName(pairsForLab(lab));
      openConfirm({
        title: "Delete this lab?",
        body: "“" + name + "” and its notes links will be removed.",
        confirmLabel: "Delete it",
        onConfirm: function () {
          if (lab.baked) hideBakedLab(lab);
          else deleteLocalLab(lab.id);
          Object.keys(state.noteLabLinks).forEach(function (key) {
            var links = state.noteLabLinks[key].filter(function (n) { return n !== name; });
            if (links.length) state.noteLabLinks[key] = links; else delete state.noteLabLinks[key];
          });
          storeSet(LS_NOTELINKS, state.noteLabLinks);
          if (state.selectedLabId === lab.id) state.selectedLabId = null;
          if (state.editingLabId === lab.id) { state.editingLabId = null; state.labsName = ""; renderLabs(); }
          else renderLabsList();
          if (state.source === "lab") renderPicker();
          updateLabsLabel();
        }
      });
    });
  });
}

    if (body === undefined && tags.length === 0 && pairs.length === 0 && labs.length === 0) return null;

    labs: allLabs().map(function (l) {

function noteTitleFromBody(body) {
  var lines = String(body || "").split("\n");
  for (var i = 0; i < lines.length; i++) if (lines[i].trim().length > 0) return lines[i].trim();
  return "Untitled note";
}
function allUnifiedNotes() {
  var mine = state.userNotes.map(function (n) {
    return { key: "user-" + n.id, id: n.id, title: noteTitleFromBody(n.body), group: "My notes", body: n.body, userId: n.id };
  });
  var hidden = {};
  state.hiddenNotes.forEach(function (k) { hidden[k] = true; });
  var built = DATA.notes.filter(function (n) { return !hidden[n.id]; }).map(function (n) {
    return { key: n.id, id: n.id, title: n.title, group: n.group, body: n.body, userId: null };
  });
  return mine.concat(built);
}
function findUnifiedNote(key) {
  var all = allUnifiedNotes();
  for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
  return null;
}
function usedTags() {
  var counts = {};
  Object.keys(state.noteTags).forEach(function (key) {
    (state.noteTags[key] || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
  });
  return Object.keys(counts).sort(function (x, y) {
    return counts[y] - counts[x] || x.localeCompare(y);
  });
}
function vocabList() {
  var seen = {}, out = [];
  function push(v) { var k = v.toLowerCase(); if (!seen[k]) { seen[k] = true; out.push(v); } }
  effectiveCategories().forEach(function (c) { push(c.name); c.items.forEach(push); });
  usedTags().forEach(push);
  return out;
}
function labNoteKeys(lab) {
  var name = lab.name || labName(pairsForLab(lab));
  var items = {};
  pairsForLab(lab).forEach(function (pr) { if (pr.item) items[pr.item.toLowerCase()] = true; });
  var keys = [], seen = {};
  allUnifiedNotes().forEach(function (n) {
    var manual = (state.noteLabLinks[n.key] || []).indexOf(name) !== -1;
    var tagged = (state.noteTags[n.key] || []).some(function (t) { return !!items[t.toLowerCase()]; });
    if ((manual || tagged) && !seen[n.key]) { seen[n.key] = true; keys.push(n.key); }
  });
  return keys;
}

/* ---------------- keyword suggestions (stem-matched) ----------------- */
function normalizeForMatch(text) {
  return String(text).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'°]+/g, " ").replace(/\s+/g, " ").trim();
}
function stemsOf(word) {
  var stems = {};
  stems[word] = true;
  if (word.endsWith("s") && word.length > 3) stems[word.slice(0, -1)] = true;
  if (word.endsWith("ing") && word.length > 5) {
    var base = word.slice(0, -3);
    stems[base] = true;
    stems[base + "e"] = true;
    if (base.length > 1 && base[base.length - 1] === base[base.length - 2]) stems[base.slice(0, -1)] = true;
  }
  if (word.endsWith("ed") && word.length > 4) stems[word.slice(0, -2)] = true;
  return Object.keys(stems).filter(function (x) { return x.length >= 3; });
}
/* Items from her own lists that the note text points at — an exact
   phrase hit, a whole-word hit, or a stem hit, so writing "trace"
   offers "Traces". Offered only, never applied. */
function suggestKeywords(text, vocab, selected) {
  var norm = normalizeForMatch(text || "");
  var haystack = " " + norm + " ";
  var words = {};
  norm.split(" ").forEach(function (w) { if (w) words[w] = true; });
  var taken = {};
  (selected || []).forEach(function (t) { taken[t.toLowerCase()] = true; });
  var found = [];
  vocab.forEach(function (item) {
    if (taken[item.toLowerCase()]) return;
    var needle = normalizeForMatch(item);
    if (needle.length < 3) return;
    var hit = haystack.indexOf(" " + needle + " ") !== -1 || haystack.indexOf(" " + needle + "s ") !== -1;
    if (!hit && needle.indexOf(" ") === -1) {
      var stems = stemsOf(needle);
      for (var i = 0; i < stems.length && !hit; i++) {
        if (words[stems[i]]) { hit = true; break; }
        if (stems[i].length >= 4) {
          for (var w in words) { if (w.indexOf(stems[i]) === 0) { hit = true; break; } }
        }
      }
    }
    if (hit) found.push(item);
  });
  return found.sort(function (x, y) { return y.length - x.length; }).slice(0, 12);
}

/* ------------------------------ tag editor --------------------------- */
/* ONE autocomplete input, because tagging has to be fast: type and a
   dropdown lists everything taggable that matches — every item in
   every category, the category names themselves (a category IS a
   tag), and tags already in use — plus an "add as new tag" row.
   Picking acts on mouse-down, before the input can blur, so the
   keyboard never has to close; unpicked text stays in the input. */
var tagEditors = {};
function registerTagEditor(id, opts) {
  tagEditors[id] = { draft: "", focused: false, getTags: opts.getTags, setTags: opts.setTags, getText: opts.getText };
}
function tagVocabEntries() {
  var out = [], seen = {};
  function push(label, hint) { var k = label.toLowerCase(); if (seen[k]) return; seen[k] = true; out.push({ label: label, hint: hint }); }
  effectiveCategories().forEach(function (c) { push(c.name, "Category"); c.items.forEach(function (it) { push(it, c.name); }); });
  usedTags().forEach(function (t) { push(t, "Tag in use"); });
  return out;
}
function tagEditorMatches(id) {
  var ed = tagEditors[id];
  var q = ed.draft.trim().toLowerCase();
  if (!q) return { matches: [], showNew: false };
  var tags = ed.getTags();
  var entries = tagVocabEntries();
  var matches = entries.filter(function (e) {
    return e.label.toLowerCase().indexOf(q) !== -1 && !tags.some(function (t) { return t.toLowerCase() === e.label.toLowerCase(); });
  }).sort(function (x, y) {
    var xp = x.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    var yp = y.label.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    return xp - yp || x.label.localeCompare(y.label);
  }).slice(0, 8);
  var exact = entries.some(function (e) { return e.label.toLowerCase() === q; });
  var already = tags.some(function (t) { return t.toLowerCase() === q; });
  return { matches: matches, showNew: !exact && !already };
}
function tagEditorHTML(id) {
  var ed = tagEditors[id];
  var tags = ed.getTags();
  var h = '<div class="taged" data-taged="' + id + '">';
  if (tags.length > 0) {
    h += '<div class="row wrap" style="gap:6px;" aria-label="Tags on this note">';
    tags.forEach(function (tag) {
      h += '<span class="tagchip">' + esc(tag) + '<button type="button" class="xbtn" data-teremove="' + esc(tag) + '" aria-label="Remove tag ' + esc(tag) + '">' + icon("x", 14) + "</button></span>";
    });
    h += "</div>";
  }
  var suggestions = suggestKeywords(ed.getText(), vocabList(), tags);
  if (suggestions.length > 0) {
    h += '<div class="mt3"><p class="kicker dim" style="margin:0;">Found in this note — tap to add</p>';

/* Anchor the open dropdown to its field inside the VISUAL viewport —

    drop.style.top = "auto";

    if (asCat) {

      return;
    }
    for (var i = 0; i < categories.length; i++) {

      if (item) {

/* -------------------------------- split ------------------------------ */
var splitChunksState = [];
/* Blocks separated by blank lines; a single block falls back to one
   chunk per line. Each chunk keeps the exact separator that stood
   before it, so merging reproduces the original byte-for-byte. */
function initialChunks(body) {
  var blocks = String(body).split(/\n[ \t]*\n/);
  if (blocks.length > 1) {
    return blocks.map(function (text, i) { return { text: text, joiner: i === 0 ? "" : "\n\n" }; })
      .filter(function (c) { return c.text.trim().length > 0; });
  }
  var lines = String(body).split("\n");
  if (lines.length > 1) {
    return lines.map(function (text, i) { return { text: text, joiner: i === 0 ? "" : "\n" }; })
      .filter(function (c) { return c.text.trim().length > 0; });
  }
  return [{ text: body, joiner: "" }];
}
function splitChunkByLine(chunk) {
  return chunk.text.split("\n").map(function (text, i) {
    return { text: text, joiner: i === 0 ? chunk.joiner : "\n" };
  }).filter(function (c) { return c.text.trim().length > 0; });
}
function renderNoteSplit(el) {
  el = el || document.getElementById("view-notes");
  el.classList.remove("notes-list-mode");
  var note = findUnifiedNote(state.noteOpenKey);
  if (!note) { state.noteSplitting = false; state.noteOpenKey = null; renderNotesList(el); return; }
  var live = splitChunksState.filter(function (c) { return c.text.trim().length > 0; });
  var h = '<button type="button" class="btn fd" id="split-back" aria-label="Back to the previous screen" style="padding:10px 18px;font-size:15px;font-weight:700;text-transform:uppercase;background:var(--surface);">' + icon("chevL", 20) + " Back</button>";
  h += '<h2 class="fd" style="font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;margin:20px 0 0;">Split note</h2>';
  h += '<p class="dim" style="font-size:16px;margin:6px 0 0;">Each piece below becomes its own note, with its text exactly as written. Tags and labs carry over to every piece. Merge pieces back together, split a piece by line, or trash a piece to leave it out.</p>';
  h += '<div class="mt4" style="display:grid;gap:12px;">';
  live.forEach(function (chunk, i) {
    h += '<div class="card" style="padding:12px 14px;">';
    h += '<p class="kicker volt" style="margin:0;">Piece ' + (i + 1) + "</p>";
    h += '<pre style="white-space:pre-wrap;overflow-wrap:break-word;font-size:16px;line-height:1.5;font-family:inherit;margin:6px 0 0;">' + esc(chunk.text) + "</pre>";
    h += '<div class="row wrap mt2" style="gap:8px;">';
    if (chunk.text.indexOf("\n") !== -1) {
      h += '<button type="button" class="btn" data-split-line="' + i + '" aria-label="Split piece ' + (i + 1) + ' into one note per line" style="padding:6px 12px;font-size:12px;font-weight:700;">Split by line</button>';
    }
    if (i < live.length - 1) {
      h += '<button type="button" class="btn" data-split-merge="' + i + '" aria-label="Merge piece ' + (i + 1) + ' with piece ' + (i + 2) + '" style="padding:6px 12px;font-size:12px;font-weight:700;">Merge with next</button>';
    }
    h += '<button type="button" class="iconbtn" data-split-trash="' + i + '" aria-label="Delete piece ' + (i + 1) + ' — throw it away" style="padding:6px;">' + icon("trash", 16) + "</button>";
    h += "</div></div>";
  });
  h += "</div>";
  h += '<button type="button" class="btn-lg btn-lg-primary mt4" id="split-confirm" style="width:100%;"' + (live.length < 2 ? " disabled" : "") + ' aria-label="Split this note into ' + live.length + ' notes">Split into ' + live.length + " notes</button>";
  h += '<button type="button" class="btn-lg btn-lg-ghost mt2" id="split-cancel" style="width:100%;" aria-label="Cancel splitting">Cancel</button>';
  el.innerHTML = h;
  document.getElementById("split-back").addEventListener("click", function () { state.noteSplitting = false; renderNotes(); });
  document.getElementById("split-cancel").addEventListener("click", function () { state.noteSplitting = false; renderNotes(); });
  el.querySelectorAll("[data-split-line]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-line"))];
      var at = splitChunksState.indexOf(chunk);
      if (at < 0) return;
      splitChunksState = splitChunksState.slice(0, at).concat(splitChunkByLine(chunk)).concat(splitChunksState.slice(at + 1));
      renderNotes();
    });
  });
  el.querySelectorAll("[data-split-merge]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-merge"))];
      var at = splitChunksState.indexOf(chunk);
      var nxt = splitChunksState[at + 1];
      if (at < 0 || !nxt) return;
      var merged = { text: chunk.text + nxt.joiner + nxt.text, joiner: chunk.joiner };
      splitChunksState = splitChunksState.slice(0, at).concat([merged]).concat(splitChunksState.slice(at + 2));
      renderNotes();
    });
  });
  el.querySelectorAll("[data-split-trash]").forEach(function (b) {
    b.addEventListener("click", function () {
      var chunk = live[Number(b.getAttribute("data-split-trash"))];
      splitChunksState = splitChunksState.filter(function (c) { return c !== chunk; });
      renderNotes();
    });
  });
  document.getElementById("split-confirm").addEventListener("click", function () {
    var good = splitChunksState.filter(function (c) { return c.text.trim().length > 0; });
    if (good.length < 2) return;
    var tags = (state.noteTags[note.key] || []).slice();
    var links = (state.noteLabLinks[note.key] || []).slice();
    good.forEach(function (chunk) {
      var nn = { id: newId("note"), body: chunk.text };
      state.userNotes.unshift(nn);
      var k = "user-" + nn.id;
      if (tags.length) state.noteTags[k] = tags.slice();
      if (links.length) state.noteLabLinks[k] = links.slice();
    });
    if (note.userId !== null) {
      state.userNotes = state.userNotes.filter(function (n) { return n.id !== note.userId; });
      delete state.noteTags[note.key];
      delete state.noteLabLinks[note.key];
    } else {
      if (state.hiddenNotes.indexOf(note.key) === -1) state.hiddenNotes.push(note.key);
      storeSet(LS_HIDDEN_NOTES, state.hiddenNotes);
    }
    storeSet(LS_NOTES, state.userNotes);
    storeSet(LS_NOTETAGS, state.noteTags);
    storeSet(LS_NOTELINKS, state.noteLabLinks);
    state.noteSplitting = false;
    state.noteOpenKey = null;
    renderNotes();
    renderLabsList();
    showToast("Split into " + good.length + " notes — each one kept its exact text and tags.");
  });
}

    var v = itemInp.value.trim();
    if (!v) return;
    if (!catDraftItems.some(function (x) { return x.toLowerCase() === v.toLowerCase(); })) catDraftItems.push(v);
    renderCategoriesScreen();
    var inp2 = document.getElementById("cat-item");
    if (inp2) inp2.focus();
  }
  document.getElementById("cat-add-item").addEventListener("click", addItem);
  itemInp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addItem(); } });
  el.querySelectorAll("[data-cat-del-item]").forEach(function (b) {
    b.addEventListener("click", function () {
      catDraftItems = catDraftItems.filter(function (x) { return x !== b.getAttribute("data-cat-del-item"); });
      renderCategoriesScreen();
    });
  });
  var nameInp = document.getElementById("cat-name");
  nameInp.addEventListener("input", function () { catDraftName = nameInp.value; });
  nameInp.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); document.getElementById("cat-create").click(); } });
  document.getElementById("cat-create").addEventListener("click", function () {
    var name = (document.getElementById("cat-name").value || "").trim();
    if (!name) { nameInp.focus(); return; }
    var clash = existing.some(function (n) { return n.toLowerCase() === name.toLowerCase(); });
    if (clash) {
      var c = document.getElementById("cat-clash");
      c.textContent = "You already have a category called “" + name + "”.";
      c.hidden = false;
      return;
    }
    var created = addCustomCategory(name);
    catDraftItems.forEach(function (it) { addCategoryItem(created, it); });
    Object.keys(pickers).forEach(function (pid) { paintPicker(pid); });
    closeCategoriesScreen();
    showToast("Category saved — it's in every picker now.");
  });
  el.querySelectorAll("[data-cat-toggle]").forEach(function (b) {
    b.addEventListener("click", function () {
      var nm = b.getAttribute("data-cat-toggle");
      state.catExpanded[nm] = !state.catExpanded[nm];
      renderCategoriesScreen();
    });
  });
}

/* =====================================================================
   Dougie background-moments stage. Playback runs through the official
   YouTube IFrame Player API on an imperatively-created node (the API
   replaces the element it is handed), born on the youtube-nocookie
   host with an explicit origin — the configuration whose absence
   produced Error 153 in the Muse version. On a 153, a ready timeout,
   or an API load failure it falls back to a plain nocookie iframe
   splice advanced by a duration timer. A tap shield keeps every touch
   in this UI; error state is a closeable panel, never a blank page.
   ===================================================================== */
var ytApiPromise = null;
function loadYouTubeApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (!ytApiPromise) {
    ytApiPromise = new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error("YouTube API load timed out")); }, 10000);
      var prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () {
        if (prev) prev();
        clearTimeout(timer);
        if (window.YT) resolve(window.YT);
        else reject(new Error("YouTube API unavailable"));
      };
      var script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.async = true;
      script.onerror = function () { clearTimeout(timer); reject(new Error("YouTube API failed to load")); };
      document.head.appendChild(script);
    });
  }
  return ytApiPromise;
}
function spliceEmbedUrl(clip) {
  var params = "autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&disablekb=1&iv_load_policy=3&fs=0&enablejsapi=1" +
    "&start=" + Math.floor(clip.start) + "&end=" + Math.floor(clip.end);
  if (/^https?:\/\//.test(window.location.origin)) params += "&origin=" + encodeURIComponent(window.location.origin);
  return "https://www.youtube-nocookie.com/embed/" + clip.videoId + "?" + params;
}
var dougie = {
  active: false, clips: [], index: 0, playing: false, failed: false,
  step: 0, showMoments: false, useFallback: false, ready: false,
  player: null, errorStreak: 0, fallbackTimer: null, readyTimer: null,
  addError: "",
  customMoments: storeGet(LS_MOMENTS, [])
};
function dougieClips() {
  return DATA.dougie.clips.concat(dougie.customMoments);
}
function persistCustomMoments() { storeSet(LS_MOMENTS, dougie.customMoments); }
function openDougieStage() {
  try {
    dougie.active = true;
    dougie.clips = dougieClips();
    dougie.index = 0;
    dougie.playing = false;
    dougie.failed = false;
    dougie.step = 0;
    dougie.showMoments = false;
    dougie.useFallback = false;
    dougie.ready = false;
    dougie.errorStreak = 0;
    dougie.addError = "";
    var el = document.getElementById("dougie-stage");
    el.hidden = false;
    renderDougieStage();
    initDougiePlayer();
  } catch (e) {
    renderDougieError();
  }
}
function closeDougieStage() {
  dougie.active = false;
  teardownDougiePlayer();
  var el = document.getElementById("dougie-stage");
  el.hidden = true;
  el.innerHTML = "";
}
function teardownDougiePlayer() {
  if (dougie.readyTimer) { clearTimeout(dougie.readyTimer); dougie.readyTimer = null; }
  if (dougie.fallbackTimer) { clearTimeout(dougie.fallbackTimer); dougie.fallbackTimer = null; }
  try { if (dougie.player) dougie.player.destroy(); } catch (e) { /* already gone */ }
  dougie.player = null;
  dougie.ready = false;
  var host = document.getElementById("dougie-host");
  if (host) host.innerHTML = "";
}
function dougieToFallback() {
  if (!dougie.active || dougie.useFallback) return;
  dougie.useFallback = true;
  dougie.ready = false;
  try { if (dougie.player) dougie.player.destroy(); } catch (e) { /* ignore */ }
  dougie.player = null;
  var host = document.getElementById("dougie-host");
  if (host) host.innerHTML = "";
  dougie.failed = false;
  dougie.playing = true;
  renderDougieStage();
  scheduleDougieFallback();
}
function initDougiePlayer() {
  var cancelled = false;
  dougie.readyTimer = setTimeout(function () { if (!dougie.ready) dougieToFallback(); }, 9000);
  var first = dougie.clips[0];
  var origin = /^https?:\/\//.test(window.location.origin) ? window.location.origin : undefined;
  loadYouTubeApi().then(function (YT) {
    if (cancelled || !dougie.active || dougie.useFallback) return;
    var host = document.getElementById("dougie-host");
    if (!host) return;
    var mount = document.createElement("div");
    mount.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";
    host.appendChild(mount);
    var playerVars = {
      autoplay: 1, controls: 0, modestbranding: 1, rel: 0, playsinline: 1,
      disablekb: 1, iv_load_policy: 3, fs: 0, enablejsapi: 1
    };
    if (first) { playerVars.start = Math.floor(first.start); playerVars.end = Math.floor(first.end); }
    if (origin) { playerVars.origin = origin; playerVars.widget_referrer = origin; }
    dougie.player = new YT.Player(mount, {
      host: "https://www.youtube-nocookie.com",
      videoId: first ? first.videoId : undefined,
      playerVars: playerVars,
      events: {
        onReady: function (e) {
          if (dougie.readyTimer) { clearTimeout(dougie.readyTimer); dougie.readyTimer = null; }
          dougie.player = e.target;
          dougie.ready = true;
          try { e.target.mute(); } catch (err) { /* best effort */ }
          dougieLoadClip(dougie.index);
        },
        onStateChange: function (e) {
          if (e.data === 1) { dougie.playing = true; dougie.errorStreak = 0; renderDougieChrome(); }
          else if (e.data === 2) { dougie.playing = false; renderDougieChrome(); }
          else if (e.data === 0) { dougieLoadClip(dougie.index + 1); }
        },
        onError: function (e) {
          if (e.data === 153) { dougieToFallback(); return; }
          dougie.errorStreak += 1;
          if (dougie.clips.length > 0 && dougie.errorStreak < dougie.clips.length) {
            dougieLoadClip(dougie.index + 1);
          } else {
            dougie.failed = true;
            dougie.playing = false;
            renderDougieChrome();
          }
        }
      }
    });
  }).catch(function () {
    if (!cancelled && dougie.active) dougieToFallback();
  });
  /* The stage can be closed while the API loads — the closure flag only
     guards this init; closeDougieStage tears down whatever exists. */
  var origClose = closeDougieStage;
  closeDougieStage = function () { cancelled = true; origClose(); };
}
function dougieLoadClip(i) {
  var list = dougie.clips;
  if (list.length === 0) return;
  var idx = ((i % list.length) + list.length) % list.length;
  dougie.index = idx;
  if (dougie.useFallback) {
    renderDougieStage();
    scheduleDougieFallback();
    return;
  }
  var c = list[idx];
  var player = dougie.player;
  if (!c || !player || !dougie.ready) { renderDougieChrome(); return; }
  try { player.loadVideoById({ videoId: c.videoId, startSeconds: c.start, endSeconds: c.end }); } catch (e) { /* play button stays up */ }
  renderDougieChrome();
}
function scheduleDougieFallback() {
  if (dougie.fallbackTimer) { clearTimeout(dougie.fallbackTimer); dougie.fallbackTimer = null; }
  if (!dougie.active || !dougie.useFallback || !dougie.playing) return;
  var c = dougie.clips[dougie.index];
  if (!c) return;
  dougie.fallbackTimer = setTimeout(function () { dougieLoadClip(dougie.index + 1); }, Math.max(1000, (c.end - c.start) * 1000));
}
function dougieTogglePlay() {
  if (dougie.failed) return;
  if (dougie.useFallback) {
    var frame = document.getElementById("dougie-fallback-frame");
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify({ event: "command", func: dougie.playing ? "pauseVideo" : "playVideo", args: [] }), "https://www.youtube-nocookie.com");
    }
    dougie.playing = !dougie.playing;
    if (dougie.playing) scheduleDougieFallback();
    else if (dougie.fallbackTimer) { clearTimeout(dougie.fallbackTimer); dougie.fallbackTimer = null; }
    renderDougieChrome();
    return;
  }
  var player = dougie.player;
  if (!player || !dougie.ready) return;
  try {
    if (dougie.playing) player.pauseVideo();
    else player.playVideo();
  } catch (e) { /* state follows player events */ }
}
function renderDougieError() {
  var el = document.getElementById("dougie-stage");
  el.hidden = false;
  el.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;">' +
    '<div style="text-align:center;"><p class="fd" style="font-size:24px;font-weight:900;color:#fff;margin:0;">Dougie background hit a snag</p>' +
    '<p style="color:rgba(255,255,255,0.7);font-size:16px;">The rest of the tool is fine — close this and try again.</p>' +
    '<button type="button" class="btn btn-accent" id="dg-error-close" style="padding:12px 24px;">Close</button></div></div>';
  document.getElementById("dg-error-close").addEventListener("click", function () { el.hidden = true; el.innerHTML = ""; dougie.active = false; });
}
function renderDougieStage() {
  var el = document.getElementById("dougie-stage");

/* =====================================================================
   Conductor — a chaos double-pendulum movement director. Up to 20
   near-identical double pendulums launch together and diverge into
   chaos, each leaving a colored trail; follow the big yellow lead bob:
   where it is is where to move toward, how fast it moves is how fast
   to move. The pivot itself travels — random-walking a drawn 4x8 grid
   that fills the screen, around a drawn circle, or through projected
   3D space. Defaults: speed 0.75x, one pendulum, and the lead's trail
   slowly cycles through colors as it moves.

  pivotMode: "grid", follow: "",

  for (var i = 0; i < conductor.count; i++) {

function pendulumStep(p, dt) {
  var g = 9.81, L1 = 1, L2 = 1, m1 = 1, m2 = 1;

function gridPoints(w, hgt) {

     play/pause button. */

  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      pts.push({
        x: w / 2 - gw / 2 + (gw * c) / (cols - 1),
        y: gTop + ((gBottom - gTop) * r) / (rows - 1)

    }
  }

}
function neighborOf(idx, cols, rows) {

  if (c < cols - 1) options.push(idx + 1);
  if (r > 0) options.push(idx - cols);
  if (r < rows - 1) options.push(idx + cols);

}

    }
  } else if (conductor.pivotMode === "circle") {
    var R = Math.min(w, hgt) * 0.17;
    var ang = conductor.pivotT * ((Math.PI * 2) / 9); /* one lap per 9 sim-seconds */
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(164,156,174,0.22)";
    ctx.lineWidth = 1;
    ctx.stroke();
    px = cx + R * Math.cos(ang);
    py = cy + R * Math.sin(ang);
  } else {
    phi = conductor.pivotT * 0.35;
    px = cx + w * 0.17 * Math.sin(conductor.pivotT * 0.26);
    py = cy + hgt * 0.13 * Math.sin(conductor.pivotT * 0.34 + 1.2);
  }

  var L = Math.min(w, hgt) * 0.17;
  function project(x, y) {
    if (conductor.pivotMode !== "3d") return { x: px + x, y: py + y, s: 1 };
    var c = Math.cos(phi), sn = Math.sin(phi);
    return { x: px + x * c, y: py + y - x * sn * 0.38, s: 1 - 0.28 * sn * (x / (L * 2)) };
  }
  var trailMax = conductor.trail * 6;
  conductor.pendulums.forEach(function (p, i) {
    var x1 = L * Math.sin(p.a1), y1 = L * Math.cos(p.a1);
    var x2 = x1 + L * Math.sin(p.a2), y2 = y1 + L * Math.cos(p.a2);
    var b1 = project(x1, y1), b2 = project(x2, y2);
    if (conductor.playing) {
      p.trail.push({ x: b2.x, y: b2.y });
      while (p.trail.length > trailMax) p.trail.shift();
    }
    var lead = i === 0;
    var pts = p.trail;
    if (pts.length > 1) {
      if (lead) {
        /* The lead's trail slowly cycles through colors: short
           chunks, each a step further along the wheel plus a slow
           drift on the clock — a full turn takes about 70 seconds,
           so the ribbon is always gradually becoming another color. */
        var chunk = 10;
        for (var s = 0; s < pts.length - 1; s += chunk) {
          var end = Math.min(pts.length - 1, s + chunk);
          ctx.beginPath();
          for (var j = s; j <= end; j++) {
            if (j === s) ctx.moveTo(pts[j].x, pts[j].y);
            else ctx.lineTo(pts[j].x, pts[j].y);
          }
          var hue = Math.round((conductor.t * 5 + (s / Math.max(1, pts.length)) * 140) % 360);
          ctx.strokeStyle = "hsla(" + hue + ", 90%, 65%, 0.85)";
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }
      } else {
        ctx.beginPath();
        pts.forEach(function (q, j) { if (j === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
        ctx.strokeStyle = "hsla(" + p.hue + ", 90%, 65%, 0.5)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    if (lead) {
      /* The lead is the one to follow: full arms and a big volt bob. */
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
      ctx.strokeStyle = "rgba(245,239,232,0.7)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath(); ctx.arc(b1.x, b1.y, 4 * b1.s, 0, Math.PI * 2); ctx.fillStyle = "#f5efe8"; ctx.fill();
      ctx.beginPath(); ctx.arc(b2.x, b2.y, 9 * b2.s, 0, Math.PI * 2); ctx.fillStyle = "#ffd23f"; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#0d0b10"; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(b2.x, b2.y, 3.5 * b2.s, 0, Math.PI * 2); ctx.fillStyle = "hsla(" + p.hue + ", 90%, 65%, 0.9)"; ctx.fill();
    }
  });
  ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fillStyle = "#a49cae"; ctx.fill();
  conductorStart();
}
function conductorStart() {
  if (state.tab !== "conductor") return;
  if (conductor.raf === null) conductor.raf = requestAnimationFrame(conductorFrame);
}
function conductorStop() {
  if (conductor.raf !== null) { cancelAnimationFrame(conductor.raf); conductor.raf = null; }
  conductor.lastTs = 0;
}

/* --------------------------- tabs + init ----------------------------- */
function switchTab(tab) {
  state.tab = tab;
  ["timer", "notes", "labs", "party", "conductor"].forEach(function (t) {
    document.getElementById("view-" + t).hidden = t !== tab;
  });
  document.getElementById("timer-footer").hidden = tab !== "timer";
  document.querySelectorAll("#tabbar [data-tab]").forEach(function (b) {
    b.setAttribute("aria-selected", b.getAttribute("data-tab") === tab ? "true" : "false");
  });
  /* Cross-tab data (note↔lab links, tags) refreshes on entry, so a
     note tagged on the Notes tab counts on its lab card right away. */
  if (tab === "labs") renderLabs();
  if (tab === "notes") renderNotes();
  /* A running session keeps the bottom nav: tapping away auto-pauses
     it and it steps aside; tapping Timer brings it back, still paused,
     with Resume. Closing it (the X) is the only way it ends early. */
  if (session.active) {
    if (tab !== "timer") {
      if (session.running) session.pauseNow();
      session.away = true;
      document.getElementById("session").hidden = true;
      roundsFx.stop();
    } else {
      session.away = false;
      document.getElementById("session").hidden = false;
      renderSession();
    }
  }
  /* One central rule: every screen change lands at the top. */
  var activeView = document.getElementById("view-" + tab);
  if (activeView) activeView.scrollTop = 0;
  window.scrollTo(0, 0);
  requestAnimationFrame(function () {
    window.scrollTo(0, 0);
    if (activeView) activeView.scrollTop = 0;
  });
  if (tab === "conductor") conductorStart();
  else conductorStop();
}
document.querySelectorAll("#tabbar [data-tab]").forEach(function (b) {
  b.addEventListener("click", function () {
    var tab = b.getAttribute("data-tab");
    /* The Notes tab lands on the list (search + notes). A fresh New
       note opens only on the app's first open (see init) — never
       from the tab — so any half-open note screen closes here. */
    if (tab === "notes") {
      state.noteWriting = false;
      state.noteOpenKey = null;
      state.noteSplitting = false;
      state.noteEditing = false;
      state.noteLabPickOpen = false;
      state.fanOpen = false;
      state.noteReturnTab = null;
    }
    switchTab(tab);
  });
});
function applyBakedLabs(list) {
  state.bakedLabs = (list || []).map(function (l) {
    return {
      name: l.name || "",
      pairs: (l.pairs || []).filter(function (p) { return p && p.category; })
        .map(function (p) { return { category: String(p.category), item: p.item ? String(p.item) : "" }; }),
      source: l.source || ""
    };
  });
  if (state.source === "lab") renderPicker();
  renderLabsList();
  var n = allLabs().length;
  updateLabsLabel();
}
