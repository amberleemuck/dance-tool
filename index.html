    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0b10;
        --surface: #17131d;
        --surface-alt: #1f1929;
        --text: #f5efe8;
        --dim: #a49cae;
        --border: #2c2635;
        --accent: #ff4d2e;
        --volt: #ffd23f;
        --radius: 12px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      .fd { font-family: "Archivo", system-ui, sans-serif; letter-spacing: -0.01em; }
      button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
      button:disabled { opacity: 0.35; cursor: default; }
      :focus-visible { outline: 2px solid var(--volt); outline-offset: 2px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      #app { display: flex; flex-direction: column; height: 100dvh; }
      .page { flex: 1; min-height: 0; position: relative; }
      .view { height: 100%; overflow-y: auto; width: 100%; max-width: 768px; margin: 0 auto; padding: 10px 12px 16px; }
      .view[hidden] { display: none; }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
      .dim { color: var(--dim); }
      .accent { color: var(--accent); }
      .volt { color: var(--volt); }

      /* ---------- buttons & fields ---------- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; border: 1px solid var(--border); padding: 7px 13px; font-size: 13px; font-weight: 600; background: var(--bg); }
      .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-family: "Archivo", system-ui, sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
      .btn-volt { background: var(--volt); border-color: var(--volt); color: #000; font-family: "Archivo", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .btn-outline-accent { border-color: var(--accent); color: var(--accent); font-family: "Archivo", system-ui, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .seg { border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: "Archivo", system-ui, sans-serif; border: 1px solid transparent; color: var(--dim); white-space: nowrap; }
      .seg[aria-pressed="true"] { background: var(--volt); color: #000; }
      .seg:not([aria-pressed="true"]) { border-color: var(--border); }
      .minchip { border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); color: var(--dim); }
      .minchip[aria-pressed="true"] { background: var(--volt); border-color: var(--volt); color: #000; }
      .iconbtn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-alt); padding: 8px; }
      .field { width: 100%; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 7px 8px; font-size: 14px; }
      select.field { appearance: auto; }
      .pairchip { display: inline-block; border: 1px solid var(--volt); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 600; }
      .bar { overflow: hidden; border-radius: 999px; background: var(--surface-alt); }
      .bar > i { display: block; height: 100%; background: var(--volt); border-radius: 999px; transition: width 0.2s linear; }
      svg.ic { flex: none; }

      /* ---------- bottom nav ---------- */
      #tabbar { border-top: 1px solid var(--border); background: rgba(13, 11, 16, 0.95); backdrop-filter: blur(8px); }
      #tabbar .inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 768px; margin: 0 auto; padding: 4px 8px max(6px, env(safe-area-inset-bottom)); }
      #tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0 2px; border-radius: 8px; font-family: "Archivo", system-ui, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
      #tabbar button[aria-selected="true"] { color: var(--accent); }

      /* ---------- timer view (fits one phone screen) ---------- */
      #view-timer { overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
      #view-timer[hidden] { display: none; }
      .stage-card { padding: 10px 12px; text-align: center; flex: none; }
      .stage-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      .stage-name { margin: 2px 0 0; font-size: 20px; font-weight: 900; line-height: 1.15; overflow-wrap: break-word; }
      .stage-clockrow { margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .clock { font-size: 36px; font-weight: 900; line-height: 1; color: var(--volt); font-variant-numeric: tabular-nums; min-width: 92px; }
      .stage-bar { height: 6px; max-width: 384px; margin: 8px auto 0; }
      .picker-card { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px; }
      .picker-scroll { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; }
      .today-wrap { flex: none; position: relative; }
      .today-bar { display: flex; width: 100%; align-items: center; gap: 8px; padding: 10px 12px; text-align: left; }
      .today-panel { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); max-height: 62dvh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px 12px; box-shadow: 0 -12px 32px rgba(0,0,0,0.55); z-index: 5; }
      .drill-row { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 6px 8px; }
      .drill-row.current { border-color: var(--volt); }
      .stepper { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid var(--border); padding: 6px; }

      /* ---------- sticky timer footer (modes + times + Start) ---------- */
      #timer-footer { flex: none; border-top: 1px solid var(--border); background: rgba(13, 11, 16, 0.97); padding: 8px 12px 10px; }
      #timer-footer[hidden] { display: none; }
      #timer-footer .inner { max-width: 768px; margin: 0 auto; }
      #timer-footer .seg { padding: 9px 14px; font-size: 14px; }
      #timer-footer .minchip { padding: 5px 9px; font-size: 11px; }
      .queue-add { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 12px; }
      .queue-add > button { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 999px; border: 2px solid var(--accent); color: var(--accent); background: var(--bg); }
      .queue-add .cap { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
      .rounds-glow.g0 { width: 120px; height: 120px; opacity: 0.07; }

      /* ---------- conductor ---------- */
      #view-conductor { overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
      #view-conductor[hidden] { display: none; }
      .conductor-stage { flex: 1; min-height: 0; position: relative; border-radius: var(--radius); overflow: hidden; background: #000; border: 1px solid var(--border); }
      .conductor-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .conductor-controls { flex: none; padding: 10px 12px; }
      .conductor-controls input[type="range"] { flex: 1; min-width: 0; accent-color: var(--volt); }
      .ctl-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); width: 74px; flex: none; }
      .ctl-val { font-size: 12px; font-weight: 700; width: 40px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }

      /* ---------- slot pickers ---------- */
      .slot { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 8px; }
      .slot + .slot { margin-top: 8px; }
      .slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
      .slot-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
      .slot-grid label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; text-transform: none; letter-spacing: 0; color: var(--text); }
      .lab-name-line { display: block; width: 100%; border: 1px solid var(--volt); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
      .rounds-center { position: relative; }
      .rounds-glow { position: absolute; left: 50%; top: 50%; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,210,63,0.85) 0%, rgba(255,77,46,0.45) 45%, transparent 70%); pointer-events: none; transition: width 0.9s ease, height 0.9s ease, opacity 0.9s ease; z-index: 0; }
      .rounds-glow.g1 { width: 180px; height: 180px; opacity: 0.22; }
      .rounds-glow.g2 { width: 260px; height: 260px; opacity: 0.42; }
      .rounds-glow.g3 { width: 340px; height: 340px; opacity: 0.62; }
      .rounds-glow.g4 { width: 440px; height: 440px; opacity: 0.88; }
      .rounds-content { position: relative; z-index: 1; }
      .stage-dots { display: flex; gap: 6px; justify-content: center; }
      .stage-dots i { width: 28px; height: 6px; border-radius: 999px; background: var(--surface-alt); display: block; }
      .stage-dots i.on { background: var(--volt); }
      @media (prefers-reduced-motion: reduce) { .rounds-glow { transition: none; } }
      .additem-form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
      .additem-form .field { flex: 1; min-width: 120px; font-size: 16px; }

      /* ---------- labs ---------- */
      .lab-card { padding: 12px; }
      .lab-card + .lab-card { margin-top: 10px; }
      .lab-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

      /* ---------- notes ---------- */
      .note-btn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 13px 16px; text-align: left; font-family: "Archivo", system-ui, sans-serif; font-size: 19px; font-weight: 700; line-height: 1.25; }
      .note-btn + .note-btn { margin-top: 8px; }

      /* ---------- party ---------- */
      .party-card { padding: 16px; }
      .party-card + .party-card { margin-top: 12px; }
      .party-card.dougie { border: 2px solid var(--volt); }

      /* ---------- overlays / stages ---------- */
      .overlay { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; }
      .overlay[hidden] { display: none; }
      .overlay.stage { background: #000; overflow: hidden; }
      .session-inner { max-width: 768px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; padding: 12px 16px 32px; }
      .session-center { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 24px 0; }
      .session-item { font-size: 44px; font-weight: 900; line-height: 1.02; overflow-wrap: break-word; }
      .session-clock { font-size: 56px; font-weight: 900; line-height: 1; color: var(--volt); font-variant-numeric: tabular-nums; }
      .session-bar { height: 12px; max-width: 384px; margin: 16px auto 0; width: 100%; }
      .transport { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--accent); color: #fff; padding: 14px 28px; font-family: "Archivo", system-ui, sans-serif; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.04em; }
      .jumpchip { border-radius: 999px; padding: 8px 12px; font-size: 14px; font-weight: 700; border: 1px solid var(--border); background: var(--surface); color: var(--dim); }
      .jumpchip[aria-current="true"] { background: var(--volt); border-color: var(--volt); color: #000; }

      .stage-frame { position: absolute; inset: 0; }
      .stage-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .stage-shield { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; }
      .grad-top { pointer-events: none; position: absolute; left: 0; right: 0; top: 0; height: 96px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
      .grad-bottom { pointer-events: none; position: absolute; left: 0; right: 0; bottom: 0; height: 256px; background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.6), transparent); }
      .stage-top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: max(12px, env(safe-area-inset-top)) 16px 0; }
      .stage-bottom { position: absolute; left: 0; right: 0; bottom: 0; max-height: 62dvh; overflow-y: auto; padding: 0 16px max(20px, env(safe-area-inset-bottom)); }
      .stage-title { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.6); margin: 4px 0 0; }
      .stage-bigstep { font-size: 30px; font-weight: 900; line-height: 1.15; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.6); margin: 12px 0 0; overflow-wrap: break-word; }
      .stepchip { border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.15); color: #fff; backdrop-filter: blur(6px); }
      .stepchip[aria-current="step"], .stepchip[aria-current="true"] { background: var(--volt); color: #000; }
      .stage-iconbtn { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(0,0,0,0.6); color: #fff; padding: 12px; backdrop-filter: blur(6px); }
      .stage-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; border-radius: 999px; background: var(--accent); color: #fff; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
      .moment-seg { height: 8px; flex: 1; border-radius: 999px; background: rgba(255,255,255,0.3); padding: 0; }
      .moment-seg[aria-current="true"] { background: var(--volt); }
      .moments-panel { margin-top: 16px; border-radius: var(--radius); background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 16px; }
      .moment-row { display: flex; align-items: center; gap: 8px; }
      .moment-row + .moment-row { margin-top: 8px; }
      .moment-main { flex: 1; min-width: 0; border-radius: 8px; padding: 8px 12px; text-align: left; font-size: 14px; background: rgba(255,255,255,0.1); color: #fff; }
      .moment-main[aria-current="true"] { background: var(--volt); color: #000; font-weight: 700; }
      .moment-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .moment-main .sub { font-size: 12px; opacity: 0.65; }
      .stage-field { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; padding: 10px 12px; font-size: 16px; }
      .stage-field::placeholder { color: rgba(255,255,255,0.5); }
      .stage-field-label { display: block; font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }

      .note-pre { white-space: pre-wrap; overflow-wrap: break-word; font-size: 17px; line-height: 1.6; font-family: inherit; margin: 10px 0 0; }
      .row { display: flex; align-items: center; gap: 8px; }
      .wrap { flex-wrap: wrap; }
      .grow { flex: 1; min-width: 0; }
      .mt1 { margin-top: 4px; } .mt2 { margin-top: 8px; } .mt3 { margin-top: 12px; } .mt4 { margin-top: 16px; }
      .small { font-size: 12px; } .sm2 { font-size: 13px; } .base { font-size: 14px; }
      .kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
      h2.sec { font-family: "Archivo", system-ui, sans-serif; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; margin: 22px 0 0; }
      h2.sec:first-child { margin-top: 4px; }

      @media (min-width: 700px) {
        .session-item { font-size: 64px; }
        .session-clock { font-size: 84px; }
        .stage-bigstep { font-size: 38px; }
        .stage-name { font-size: 22px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar > i { transition: none; }
      }
    </style>

    <div id="app">
      <div class="page">
        <!-- ============================ TIMER ============================ -->
        <main id="view-timer" class="view" aria-label="Timer">
          <section class="card stage-card" aria-label="Drill timer" id="queue-stage"></section>

          <section class="card picker-card" aria-label="Drill a lab">
            <div>
              <h2 class="fd" style="font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em; margin: 0;">Drill a lab</h2>
              <div class="row mt1" role="group" aria-label="What to drill" style="gap: 6px;">
                <button type="button" class="seg fd" id="src-lab" aria-pressed="true">Saved lab</button>
                <button type="button" class="seg fd" id="src-quick" aria-pressed="false">Pick your own</button>
              </div>
            </div>
            <div class="picker-scroll" id="picker-body"></div>
            <div id="picker-add"></div>
          </section>

          <div class="today-wrap">
            <section class="card" aria-label="Today's drills">
              <button type="button" class="today-bar" id="today-bar" aria-expanded="false"></button>
            </section>
            <div class="today-panel" id="today-panel" hidden></div>
          </div>
        </main>

        <!-- ============================ NOTES ============================ -->
        <main id="view-notes" class="view" aria-label="Notes" hidden></main>

        <!-- ============================ LABS ============================= -->
        <main id="view-labs" class="view" aria-label="Labs" hidden></main>

        <!-- ============================ PARTY ============================ -->
        <main id="view-party" class="view" aria-label="Party" hidden></main>

        <!-- ========================== CONDUCTOR ========================== -->
        <main id="view-conductor" class="view" aria-label="Conductor" hidden></main>
      </div>

      <div id="timer-footer" aria-label="Practice mode and start"><div class="inner" id="timer-footer-inner"></div></div>

      <nav id="tabbar" aria-label="Dance Tool sections">
        <div class="inner" role="tablist">
          <button type="button" role="tab" data-tab="timer" aria-selected="true">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13a7 7 0 1 0 14 0a7 7 0 0 0 -14 0" /><path d="M12 10l0 3l2 0" /><path d="M9 3h6" /></svg>
            Timer
          </button>
          <button type="button" role="tab" data-tab="notes" aria-selected="false">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3H7a2 2 0 0 0 -2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2V9z" /><path d="M13 3v6h6" /></svg>
            Notes
          </button>
          <button type="button" role="tab" data-tab="labs" aria-selected="false">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v6.343M14 2v6.343M10 8.343L5.789 15.58A2 2 0 0 0 7.526 18.5h8.948a2 2 0 0 0 1.737 -2.92L14 8.343" /><path d="M8.5 2h7" /><path d="M7 16h10" /></svg>
            <span id="labs-tab-label">Labs</span>
          </button>
          <button type="button" role="tab" data-tab="party" aria-selected="false">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M9 17V4h10v13" /><path d="M9 8h10" /></svg>
            Party
          </button>
          <button type="button" role="tab" data-tab="conductor" aria-selected="false">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21l15 -15l-3 -3L3 18l3 3z" /><path d="M15 6l3 3" /><path d="M9 3.5l.6 1.7L11.3 5.8l-1.7.6L9 8.1l-.6 -1.7L6.7 5.8l1.7 -.6z" /></svg>
            Conductor
          </button>
        </div>
      </nav>
    </div>

    <!-- Practice session (Together / In turn) -->
    <div id="session" class="overlay" role="dialog" aria-modal="true" hidden></div>

    <!-- Party follow-along stage -->
    <div id="party-stage" class="overlay stage" role="dialog" aria-modal="true" hidden></div>

    <!-- Dougie background-moments stage -->
    <div id="dougie-stage" class="overlay stage" role="dialog" aria-modal="true" hidden></div>

    <!-- Single note view -->
    <div id="note-view" class="overlay" role="dialog" aria-modal="true" hidden></div>

function storeGet(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (raw === null) return fallback;
    var v = JSON.parse(raw);
    return v === null || v === undefined ? fallback : v;
  } catch (e) { return fallback; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode etc. — state still works for the session */ }
}

/* --------------------------- catalog merge --------------------------- */
function effectiveCategories() {
  var baked = (DATA && DATA.customItems) || {};
  return DATA.categories.map(function (c) {
    var seen = {};
    var items = [];
    function push(it) {
      var k = String(it).toLowerCase();
      if (!seen[k]) { seen[k] = true; items.push(it); }
    }
    c.items.forEach(push);
    (baked[c.name] || []).forEach(push);
    (state.customItems[c.name] || []).forEach(push);
    return { name: c.name, items: items };
  });
}
function addCategoryItem(category, item) {
  var cats = effectiveCategories();
  var cat = null;
  for (var i = 0; i < cats.length; i++) if (cats[i].name === category) cat = cats[i];
  if (!cat) return false;
  var lower = item.toLowerCase();
  for (var j = 0; j < cat.items.length; j++) if (cat.items[j].toLowerCase() === lower) return false;
  if (!state.customItems[category]) state.customItems[category] = [];
  state.customItems[category].push(item);
  storeSet(LS_ITEMS, state.customItems);
  return true;
}

/* ------------------------------ labs --------------------------------- */
function labSignature(lab) {
  return (lab.pairs || []).map(function (p) { return p.category + "" + p.item; }).join("|") + "#" + (lab.name || "");
}
function allLabs() {
  var out = [];
  var seen = {};
  state.bakedLabs.forEach(function (l) {
    var lab = { id: "baked-" + out.length, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: true };
    var sig = labSignature(lab);
    if (state.hiddenBaked.indexOf(sig) !== -1) return;
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  state.localLabs.forEach(function (l) {
    var lab = { id: l.id, name: l.name || "", pairs: l.pairs || [], source: l.source || "", baked: false };
    var sig = labSignature(lab);
    if (!seen[sig]) { seen[sig] = true; out.push(lab); }
  });
  return out;
}
function pairsForLab(lab) {
  if (lab.pairs && lab.pairs.length > 0) return lab.pairs;
  return (lab.moves || []).map(function (item) {
    return { category: lab.source === "party" ? "Party steps" : "Lab", item: item };
  });
}
function labName(pairs) {
  return pairs.map(function (p) { return p.item ? p.item : "Random " + p.category; }).join(" · ") || "Lab";
}
/* The pairs a set of slots stands for right now: a chosen category with

function snapshotPairs(slots) {

function esc(s) {

}
function fmtTimestamp(totalSeconds) {

}

}

  var t = String(input || "").trim();
  if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
  var patterns = [/[?&]v=([A-Za-z0-9_-]{11})/, /youtu\.be\/([A-Za-z0-9_-]{11})/, /\/embed\/([A-Za-z0-9_-]{11})/, /\/shorts\/([A-Za-z0-9_-]{11})/];

    var m = t.match(patterns[i]);

  }

}
function parseTimestamp(input) {
  var t = String(input || "").trim().replace(/s$/i, "");
  if (!t) return null;
  if (/^\d+(\.\d+)?$/.test(t)) return Number(t);
  var parts = t.split(":").map(function (p) { return Number(p); });
  for (var i = 0; i < parts.length; i++) if (isNaN(parts[i]) || parts[i] < 0) return null;
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  return null;
}

var audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;

  } catch (e) { /* sound is a nicety */ }
}

  if (!audioCtx) return;

    var t0 = audioCtx.currentTime;
    [0, 0.28, 0.56].forEach(function (off) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t0 + off);
      gain.gain.exponentialRampToValueAtTime(0.5, t0 + off + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.22);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0 + off);
      osc.stop(t0 + off + 0.25);

  } catch (e) { /* visual state still advances */ }
}

          wakeLock = wl;
          wl.addEventListener("release", function () { wakeLock = null; });
          if (!wakeWanted) setWake(false);
        }).catch(function () { /* best effort */ });
      }
    } else if (wakeLock) {
      var wl = wakeLock; wakeLock = null;
      wl.release().catch(function () {});
    }
  } catch (e) { /* best effort */ }
}

/* =====================================================================

  var itemsOf = {};

  var used = {};

  slots.forEach(function (slot, i) {
    if (slot.category && slot.item && !usedIn(slot.category)[slot.item]) {

      results[i] = { category: slot.category, item: slot.item, fixed: true, rolledCategory: false };
    }

  slots.forEach(function (slot, i) {
    if (results[i] || !slot.category) return;
    var items = (itemsOf[slot.category] || []).filter(function (it) { return !usedIn(slot.category)[it]; });
    var item = pickRandom(items);
    if (item) {

    }

    });
    var category = pickRandom(open);

    var item = pickRandom(category.items.filter(function (it) { return !usedIn(category.name)[it]; }));
    if (!item) return;
    usedIn(category.name)[item] = true;

      category: category.name, item: item, fixed: false, rolledCategory: !slot.category,

    if (!cat) return;

    var options = cat.items.filter(function (it) { return !taken[it] && it !== slot.item; });

/* =====================================================================
   Practice session — full-screen.
   Together: every item on screen at once, layered, freeform, one
   countdown for the drill length; beeps and vibrates at zero.
   In turn: one item at a time, 30 seconds each on a progress bar;
   labs cycle into new rounds, party steps end after one pass.
   ===================================================================== */
var session = {
  active: false, labs: [], labIndex: 0, title: "", items: [], mode: "together",
  togetherMinutes: 5, inTurnSeconds: 30, roundSeconds: 60,
  index: 0, round: 1, remaining: 0, running: false, done: false, endAt: null,
  lastStage: 1, phase: "round", /* rounds: "round" | "break" (10s) */
  currentLab: function () { return this.labs[Math.min(this.labIndex, this.labs.length - 1)] || null; },
  segmentSeconds: function () {
    if (this.mode === "rounds") return this.phase === "break" ? 10 : (this.roundSeconds || 60);
    if (this.mode === "together") return Math.max(1, this.togetherMinutes) * 60;
    return this.inTurnSeconds || TURN_SECONDS;
  },
  roundStage: function () {
    var total = this.roundSeconds || 60;
    var elapsed = Math.max(0, total - this.remaining);
    return Math.min(total / STAGE_SECONDS, Math.floor(elapsed / STAGE_SECONDS) + 1);
  },
  syncLab: function () {
    var lab = this.currentLab();
    this.title = lab ? lab.title : "";
    this.items = lab ? lab.items : [];
    this.index = 0;
    this.lastStage = 1;
  },
  startPause: function () {
    ensureAudio();
    if (this.done) { this.labIndex = 0; this.phase = "round"; this.syncLab(); this.goToItem(0, true); return; }
    if (this.running) {
      if (this.endAt !== null) this.remaining = Math.max(0, (this.endAt - Date.now()) / 1000);
      this.endAt = null;
      this.running = false;
      setWake(false);
    } else {
      var secs = this.remaining > 0 ? this.remaining : this.segmentSeconds();
      this.remaining = secs;
      this.endAt = Date.now() + secs * 1000;
      this.running = true;
      setWake(true);
    }
    renderSession();
  },
  /* Prev / next have one job: switch labs. */
  goToLab: function (i, keepRunning) {
    if (this.labs.length === 0) return;
    this.labIndex = Math.max(0, Math.min(this.labs.length - 1, i));
    this.done = false;
    this.phase = "round";
    this.syncLab();
    this.remaining = this.segmentSeconds();
    if (keepRunning) {
      this.endAt = Date.now() + this.remaining * 1000;
      this.running = true;
    } else {
      this.endAt = null;
      this.running = false;
      setWake(false);
    }
    renderSession();
  },
  /* Item chips have one job: switch items within the current lab. */
  goToItem: function (i, keepRunning) {
    if (this.items.length === 0) return;
    this.index = Math.max(0, Math.min(this.items.length - 1, i));
    this.done = false;
    this.lastStage = 1;
    this.remaining = this.segmentSeconds();
    if (keepRunning) {
      this.endAt = Date.now() + this.remaining * 1000;
      this.running = true;
    } else {
      this.endAt = null;
      this.running = false;
      setWake(false);
    }
    renderSession();
  },
  advance: function () {
    /* Segment timer hit zero. */
    if (this.mode === "rounds") {
      if (this.phase === "round") {
        beep();
        this.phase = "break";
        this.remaining = 10;
        this.endAt = Date.now() + 10000;
        renderSession();
        return;
      }
      /* Break over: next lab's round, cycling until stopped. */
      this.phase = "round";
      this.labIndex = (this.labIndex + 1) % this.labs.length;
      this.syncLab();
      this.remaining = this.segmentSeconds();
      this.endAt = Date.now() + this.remaining * 1000;
      renderSession();
      return;
    }
    if (this.mode === "inturn") {
      if (this.index + 1 < this.items.length) {
        this.index += 1;
        this.remaining = this.segmentSeconds();
        this.endAt = Date.now() + this.remaining * 1000;
        renderSession();
        return;
      }
      if (this.labIndex + 1 < this.labs.length) {
        beep();
        this.labIndex += 1;
        this.syncLab();
        this.remaining = this.segmentSeconds();
        this.endAt = Date.now() + this.remaining * 1000;
        renderSession();
        return;
      }
    }
    if (this.mode === "together" && this.labIndex + 1 < this.labs.length) {
      beep();
      this.labIndex += 1;
      this.syncLab();
      this.remaining = this.segmentSeconds();
      this.endAt = Date.now() + this.remaining * 1000;
      renderSession();
      return;
    }
    beep();
    this.endAt = null;
    this.remaining = 0;
    this.running = false;
    this.done = true;
    setWake(false);
    renderSession();
  },
  tick: function () {
    if (!this.active || !this.running || this.endAt === null) return;
    var left = (this.endAt - Date.now()) / 1000;
    if (left > 0) {
      this.remaining = left;
      if (this.mode === "rounds" && this.phase === "round") {
        var st = this.roundStage();
        if (st !== this.lastStage) { this.lastStage = st; renderSession(); return; }
      }
      updateSessionClock(); return;
    }
    this.advance();
  },
  close: function () {
    this.active = false;
    this.running = false;
    this.endAt = null;
    setWake(false);
    document.getElementById("session").hidden = true;
  }
};
function openSession(cfg) {
  ensureAudio();
  session.labs = cfg.labs && cfg.labs.length ? cfg.labs : [{ title: cfg.title || "Lab", items: cfg.items || [] }];
  session.mode = cfg.mode;
  session.togetherMinutes = cfg.togetherMinutes || 5;
  session.inTurnSeconds = cfg.inTurnSeconds || state.inTurnSeconds || TURN_SECONDS;
  session.roundSeconds = cfg.roundSeconds || state.roundSeconds || 60;
  session.labIndex = 0;
  session.round = 1;
  session.phase = "round";
  session.done = false;
  session.syncLab();
  session.remaining = session.segmentSeconds();
  session.endAt = Date.now() + session.remaining * 1000;
  session.running = true;
  session.active = true;
  setWake(true);
  document.getElementById("session").hidden = false;
  renderSession();
}
function labNavHTML(idx, count) {

    h += '<div class="rounds-content">';
    h += '<p class="kicker accent" style="font-size:13px;margin:0;">Break</p>';
    h += '<p class="fd session-item mt3">Rest</p>';
    h += '<p class="fd session-clock mt4" id="s-clock" aria-label="' + esc(fmtClock(session.remaining)) + ' of break remaining">' + esc(fmtClock(session.remaining)) + "</p>";
    h += '<div class="bar session-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(progress) + '" aria-label="Time through this break"><i id="s-bar" style="width:' + progress + '%"></i></div>';
    if (nextLab) h += '<p class="dim" style="font-size:17px;">Next round: <strong style="color:var(--text)">' + esc(nextLab.title) + "</strong></p>";
    h += '<div class="mt4"><button type="button" class="transport" id="s-pause">' + (session.running ? icon("pause", 24) + " Pause" : icon("play", 24) + " Resume") + "</button></div>";

    h += '<div class="rounds-glow g' + stageNow + '" id="s-glow" aria-hidden="true"></div>';
    h += '<div class="rounds-content">';
    h += '<p class="kicker accent" style="font-size:13px;margin:0;">Rounds · Stage ' + stageNow + " of " + totalStages + (labCount > 1 ? ' <span class="dim">· Lab ' + (session.labIndex + 1) + " of " + labCount + "</span>" : "") + "</p>";
    h += '<div class="mt3" style="display:grid;gap:10px;">';
    items.forEach(function (it) {
      h += '<div><p class="kicker dim" style="margin:0;">' + esc(it.category) + '</p><p class="fd session-item" style="font-size:34px;">' + esc(it.item) + "</p></div>";
    });

    h += '<div class="bar session-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(progress) + '" aria-label="Time through this round"><i id="s-bar" style="width:' + progress + '%"></i></div>';
    h += '<div class="stage-dots mt3" id="s-dots" aria-hidden="true">' + dots + "</div>";
    h += '<div class="mt4"><button type="button" class="transport" id="s-pause">' + (session.running ? icon("pause", 24) + " Pause" : icon("play", 24) + " Resume") + "</button></div>";
    h += "</div></div>";
    h += labNavHTML(session.labIndex, labCount);
  } else if (session.mode === "together") {
    h += '<p class="kicker accent" style="font-size:13px;margin:0;">Together · layered' + (labCount > 1 ? ' <span class="dim">· Lab ' + (session.labIndex + 1) + " of " + labCount + "</span>" : "") + "</p>";

  } else if (cur) {

      h += '<button type="button" class="jumpchip" data-jump="' + i + '" aria-label="Jump to item ' + (i + 1) + ": " + esc(it.item) + '"' + (i === idx ? ' aria-current="true"' : "") + ">" + (i + 1) + ". " + esc(it.item) + "</button>";
    });

function updateSessionClock() {
  if (!session.active || session.done) return;
  var seg = session.segmentSeconds();
  var progress = Math.min(100, Math.max(0, ((seg - session.remaining) / seg) * 100));
  var clockEl = document.getElementById("s-clock");
  if (clockEl) {
    if (session.mode === "together" || session.mode === "rounds") {
      clockEl.textContent = fmtClock(session.remaining);
      clockEl.setAttribute("aria-label", fmtClock(session.remaining) + " remaining");
    } else {
      clockEl.textContent = Math.ceil(session.remaining) + "s";
      clockEl.setAttribute("aria-label", Math.ceil(session.remaining) + " seconds on this item");
    }
  }
  var bar = document.getElementById("s-bar");
  if (bar) {
    bar.style.width = progress + "%";
    var pb = bar.parentElement;
    if (pb) pb.setAttribute("aria-valuenow", String(Math.round(progress)));
  }
  if (session.mode === "rounds" && session.phase === "round") {
    var glow = document.getElementById("s-glow");
    if (glow) glow.className = "rounds-glow g" + session.roundStage();
  }
}

/* ------------------------- export / import --------------------------- */
function exportLabs() {
  var mergedCustom = {};
  var bakedCustom = (DATA && DATA.customItems) || {};
  Object.keys(bakedCustom).forEach(function (k) { mergedCustom[k] = bakedCustom[k].slice(); });
  Object.keys(state.customItems).forEach(function (k) {
    mergedCustom[k] = (mergedCustom[k] || []).concat((state.customItems[k] || []).filter(function (it) {
      return (mergedCustom[k] || []).indexOf(it) === -1;
    }));
  });
  var payload = {
    labs: allLabs().map(function (l) {
      return {
        name: l.name || labName(pairsForLab(l)),
        pairs: pairsForLab(l).map(function (p) { return { category: p.category, item: p.item || "" }; })
      };
    }),
    customItems: mergedCustom
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "labs.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  labsFileStatus("Exported " + payload.labs.length + (payload.labs.length === 1 ? " lab" : " labs") + " to labs.json.");
}
function labsFileStatus(msg) {
  var el = document.getElementById("labs-file-status");
  if (!el) return;
  el.textContent = msg;
  el.hidden = !msg;
}
document.getElementById("import-file").addEventListener("change", function (e) {
  var file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var parsed = JSON.parse(String(reader.result || ""));
      var list = Array.isArray(parsed) ? parsed : parsed.labs;
      if (!Array.isArray(list)) throw new Error("no labs array");
      /* Custom items in the file join the lists first, so labs that use
         them validate instead of being skipped. */
      if (parsed && !Array.isArray(parsed) && parsed.customItems && typeof parsed.customItems === "object") {
        Object.keys(parsed.customItems).forEach(function (cat) {
          (parsed.customItems[cat] || []).forEach(function (item) { addCategoryItem(cat, String(item)); });
        });
      }
      var cats = effectiveCategories();
      var valid = {};
      cats.forEach(function (c) {
        valid[c.name] = {};
        c.items.forEach(function (it) { valid[c.name][it] = true; });
      });
      var existing = {};
      allLabs().forEach(function (l) { existing[labSignature({ name: l.name, pairs: pairsForLab(l) })] = true; });
      var added = 0;
      var skipped = 0;
      list.forEach(function (raw) {
        if (!raw || !Array.isArray(raw.pairs) || raw.pairs.length === 0) { skipped += 1; return; }
        var pairs = [];
        var ok = true;
        raw.pairs.forEach(function (p) {
          if (!p || !p.category || !valid[String(p.category)]) { ok = false; return; }
          var item = p.item === null || p.item === undefined ? "" : String(p.item);
          /* An empty item is a random slot — valid for its category. */
          if (item !== "" && !valid[String(p.category)][item]) { ok = false; return; }
          pairs.push({ category: String(p.category), item: item });
        });
        if (!ok || pairs.length === 0) { skipped += 1; return; }
        var name = raw.name ? String(raw.name) : labName(pairs);
        var sig = labSignature({ name: name, pairs: pairs });
        if (existing[sig]) { skipped += 1; return; }
        existing[sig] = true;
        state.localLabs.unshift({ id: newId("lab"), name: name, pairs: pairs, source: raw.source || "" });
        added += 1;
      });
      storeSet(LS_LABS, state.localLabs);
      renderLabsList();
      renderLabs();
      if (state.source === "lab") renderPicker();
      document.getElementById("labs-tab-label").textContent = "Labs (" + allLabs().length + ")";
      var msg = "Imported " + added + (added === 1 ? " new lab." : " new labs.");
      if (skipped > 0) msg += " Skipped " + skipped + (skipped === 1 ? " lab" : " labs") + " — already here, or their categories/items don't match your lists.";
      labsFileStatus(msg);
    } catch (err) {
      labsFileStatus("That file couldn't be read as a labs.json — nothing was imported.");
    }
  };
  reader.readAsText(file);
});

function renderNotes() {
  var el = document.getElementById("view-notes");
  var h = "";
  DATA.noteGroups.forEach(function (group, gi) {
    h += '<section aria-label="' + esc(group) + '"' + (gi > 0 ? ' style="margin-top:22px;"' : "") + ">";
    h += '<h2 class="fd" style="font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:0.02em;margin:0 0 10px;">' + esc(group) + "</h2>";
    DATA.notes.filter(function (n) { return n.group === group; }).forEach(function (note) {
      h += '<button type="button" class="note-btn" data-note="' + esc(note.id) + '" aria-label="Open note: ' + esc(note.title) + '"><span style="min-width:0;overflow-wrap:break-word;">' + esc(note.title) + '</span><span class="dim">' + icon("chevR", 24) + "</span></button>";
    });
    h += "</section>";
  });
  el.innerHTML = h;
  el.querySelectorAll("[data-note]").forEach(function (b) {
    b.addEventListener("click", function () { openNote(b.getAttribute("data-note")); });
  });
}
function openNote(id) {
  var note = null;
  DATA.notes.forEach(function (n) { if (n.id === id) note = n; });
  if (!note) return;
  var groupNotes = DATA.notes.filter(function (n) { return n.group === note.group; });
  var at = groupNotes.findIndex(function (n) { return n.id === note.id; });
  var prev = at > 0 ? groupNotes[at - 1] : null;
  var next = at >= 0 && at < groupNotes.length - 1 ? groupNotes[at + 1] : null;
  var el = document.getElementById("note-view");
  var h = '<div style="max-width:768px;margin:0 auto;padding:12px 16px 32px;">';
  h += '<button type="button" class="btn fd" id="note-back" aria-label="Back to all notes" style="padding:10px 18px;font-size:15px;font-weight:700;text-transform:uppercase;background:var(--surface);">' + icon("chevL", 20) + " Notes</button>";
  h += '<p class="kicker accent" style="font-size:13px;margin-top:18px;">' + esc(note.group) + "</p>";
  h += '<pre class="note-pre">' + esc(note.body) + "</pre>";
  if (prev || next) {
    h += '<div class="row" style="justify-content:space-between;margin-top:28px;gap:12px;">';
    h += prev
      ? '<button type="button" class="btn" data-note-nav="' + esc(prev.id) + '" aria-label="Previous note: ' + esc(prev.title) + '" style="padding:10px 14px;background:var(--surface);">' + icon("chevL", 18) + '<span style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(prev.title) + "</span></button>"
      : "<span></span>";
    h += next
      ? '<button type="button" class="btn" data-note-nav="' + esc(next.id) + '" aria-label="Next note: ' + esc(next.title) + '" style="padding:10px 14px;background:var(--surface);"><span style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(next.title) + "</span>" + icon("chevR", 18) + "</button>"
      : "<span></span>";
    h += "</div>";
  }
  h += "</div>";
  el.innerHTML = h;
  el.hidden = false;
  el.scrollTop = 0;
  document.getElementById("note-back").addEventListener("click", function () { el.hidden = true; });
  el.querySelectorAll("[data-note-nav]").forEach(function (b) {
    b.addEventListener("click", function () { openNote(b.getAttribute("data-note-nav")); });
  });
}

/* =====================================================================
   Party — the six party dances (follow-along stages) plus the Dougie
   background-moments card.
   ===================================================================== */
function renderParty() {
  var el = document.getElementById("view-party");
  var d = DATA.dougie;
  var h = '<section class="card party-card dougie" aria-label="Dougie background playlist">';
  h += '<div class="row wrap" style="justify-content:space-between;align-items:baseline;"><h2 class="fd" style="font-size:20px;font-weight:900;margin:0;">' + esc(d.name) + '</h2><span class="dim base">' + esc(d.artist) + "</span></div>";
  h += '<div class="row wrap mt3">';
  h += '<button type="button" class="btn btn-volt" id="party-dougie-open" aria-label="Open the Dougie background playlist" style="padding:10px 16px;font-size:13px;">' + icon("play", 16) + " Play as background</button>";
  h += '<button type="button" class="btn" id="party-dougie-steps" style="padding:10px 16px;">Drill the steps</button>';
  h += "</div></section>";
  DATA.partyDances.forEach(function (dance) {
    h += '<article class="card party-card" aria-label="' + esc(dance.name) + '">';
    h += '<div class="row wrap" style="justify-content:space-between;align-items:baseline;"><h2 class="fd" style="font-size:20px;font-weight:900;margin:0;">' + esc(dance.name) + '</h2><span class="dim base">' + esc(dance.artist) + "</span></div>";
    h += '<p class="dim base" style="line-height:1.5;margin:6px 0 0;">' + esc(dance.blurb) + "</p>";
    h += '<p class="base" style="margin:10px 0 0;"><span class="volt" style="font-weight:600;">Steps: </span><span class="dim">' + esc(dance.steps.join(" → ")) + "</span></p>";
    h += '<div class="row wrap mt3">';
    h += '<button type="button" class="btn btn-accent" data-party-open="' + esc(dance.id) + '" aria-label="Follow along with ' + esc(dance.name) + ' video" style="padding:10px 16px;font-size:13px;">' + icon("play", 16) + " Follow along</button>";
    h += '<button type="button" class="btn" data-party-steps="' + esc(dance.id) + '" style="padding:10px 16px;">Drill the steps</button>';
    h += '<a href="' + esc(watchUrl(dance.videoId)) + '" target="_blank" rel="noopener noreferrer" class="dim base" style="font-weight:600;">' + esc(dance.videoLabel) + " " + icon("ext", 14) + "</a>";
    h += "</div></article>";
  });
  el.innerHTML = h;
  document.getElementById("party-dougie-open").addEventListener("click", function () { openDougieStage(); });
  document.getElementById("party-dougie-steps").addEventListener("click", function () {
    openSession({
      title: d.name,
      items: d.steps.map(function (s) { return { category: d.name, item: s }; }),
      mode: "inturn", togetherMinutes: 5, loop: false
    });
  });
  el.querySelectorAll("[data-party-open]").forEach(function (b) {
    b.addEventListener("click", function () {
      var dance = null;
      DATA.partyDances.forEach(function (x) { if (x.id === b.getAttribute("data-party-open")) dance = x; });
      if (dance) openPartyStage(dance);
    });
  });
  el.querySelectorAll("[data-party-steps]").forEach(function (b) {
    b.addEventListener("click", function () {
      var dance = null;
      DATA.partyDances.forEach(function (x) { if (x.id === b.getAttribute("data-party-steps")) dance = x; });
      if (!dance) return;
      openSession({
        title: dance.name,
        items: dance.steps.map(function (s) { return { category: dance.name, item: s }; }),
        mode: "inturn", togetherMinutes: 5, loop: false
      });
    });
  });
}

/* ------------------------- Party follow-along stage ------------------ */
var partyStageState = { dance: null, step: 0, saved: false };
function openPartyStage(dance) {

      dougie.customMoments.push(clipObj);
      persistCustomMoments();
      dougie.clips = dougieClips();
      dougie.addError = "";

}
function dougieRemoveClip(i) {
  var cur = dougie.index;
  var removed = dougie.clips[i];
  if (!removed) return;
  if (String(removed.id).indexOf("custom-") === 0) {
    dougie.customMoments = dougie.customMoments.filter(function (c) { return c.id !== removed.id; });
    persistCustomMoments();
  }
  dougie.clips = dougie.clips.filter(function (_, j) { return j !== i; });
  if (dougie.clips.length === 0) { dougie.clips = dougieClips(); return; }
  if (i < cur) {
    dougie.index = cur - 1;
    renderDougieChrome();
  } else if (i === cur) {
    dougieLoadClip(Math.min(cur, dougie.clips.length - 1));
  } else {
    renderDougieChrome();
  }
}

/* =====================================================================
   Conductor — a chaos double-pendulum movement director. Up to 20
   near-identical double pendulums launch together and diverge into
   chaos, each leaving a colored trail; follow the big yellow lead bob:
   where it is is where to move toward, how fast it moves is how fast
   to move. The pivot itself travels — on a drawn 4x3 grid, around a
   drawn circle, or through projected 3D space. Default speed 0.5x.
   ===================================================================== */
var conductor = {
  playing: true, speed: 0.5, chaos: 5, count: 12, trail: 60,
  pivotMode: "grid", follow: "",
  pendulums: [], t: 0, raf: null, lastTs: 0,
  pivot: { x: 0, y: 0 }, gridIdx: 0, gridTimer: 0
};
function conductorReset() {
  conductor.pendulums = [];
  conductor.t = 0;
  conductor.gridIdx = 0;
  conductor.gridTimer = 0;
  var spread = 0.0016 * conductor.chaos; /* per-pendulum launch offset */
  for (var i = 0; i < conductor.count; i++) {
    var off = (i - (conductor.count - 1) / 2) * spread;
    conductor.pendulums.push({
      a1: 2.15 + off, a2: 2.75 + off * 1.7, w1: 0, w2: 0, trail: []
    });
  }
}
function pendulumStep(p, dt) {
  var g = 9.81, L1 = 1, L2 = 1, m1 = 1, m2 = 1;
  var a1 = p.a1, a2 = p.a2, w1 = p.w1, w2 = p.w2;
  var d = a1 - a2;
  var den = 2 * m1 + m2 - m2 * Math.cos(2 * d);
  var dw1 = (-g * (2 * m1 + m2) * Math.sin(a1) - m2 * g * Math.sin(a1 - 2 * a2) - 2 * Math.sin(d) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(d))) / (L1 * den);
  var dw2 = (2 * Math.sin(d) * (w1 * w1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(a1) + w2 * w2 * L2 * m2 * Math.cos(d))) / (L2 * den);
  p.w1 += dw1 * dt; p.w2 += dw2 * dt;
  p.a1 += p.w1 * dt; p.a2 += p.w2 * dt;
}
function renderConductor() {
  var el = document.getElementById("view-conductor");
  var parts = bodyPartItems();
  var h = '<div class="conductor-stage"><canvas id="conductor-canvas" aria-label="Chaos double pendulums — follow the big yellow bob"></canvas></div>';
  h += '<section class="card conductor-controls" aria-label="Conductor controls">';
  h += '<div class="row" style="gap:8px;">';
  h += '<button type="button" class="btn btn-accent" id="c-playpause" style="padding:8px 16px;font-size:13px;">' + (conductor.playing ? icon("pause", 16) + " Pause" : icon("play", 16) + " Play") + "</button>";
  h += '<button type="button" class="btn" id="c-restart" style="padding:8px 14px;font-size:13px;">' + icon("restart", 14) + " Restart</button>";
  h += '<span class="grow"></span>';
  h += '<span class="dim small" id="c-follow-label" style="font-weight:600;text-align:right;">' + (conductor.follow ? "Follow the yellow bob with your " + esc(conductor.follow) : "Follow the yellow bob") + "</span>";
  h += "</div>";
  h += '<div class="row mt2" role="group" aria-label="Pivot movement" style="gap:6px;"><span class="ctl-label">Pivot</span>';
  ["grid", "circle", "3d"].forEach(function (m) {
    var label = m === "3d" ? "3D" : m.charAt(0).toUpperCase() + m.slice(1);
    h += '<button type="button" class="seg fd" data-pivot="' + m + '" aria-pressed="' + (conductor.pivotMode === m ? "true" : "false") + '" style="padding:6px 12px;font-size:12px;">' + label + "</button>";
  });
  h += "</div>";
  h += '<div class="row mt2"><label class="ctl-label" for="c-speed">Speed</label><input type="range" id="c-speed" min="0.1" max="1.5" step="0.1" value="' + conductor.speed + '" /><span class="ctl-val" id="c-speed-val">' + conductor.speed.toFixed(1) + "x</span></div>";
  h += '<div class="row mt1"><label class="ctl-label" for="c-chaos">Chaos</label><input type="range" id="c-chaos" min="1" max="10" step="1" value="' + conductor.chaos + '" /><span class="ctl-val" id="c-chaos-val">' + conductor.chaos + "</span></div>";
  h += '<div class="row mt1"><label class="ctl-label" for="c-count">Pendulums</label><input type="range" id="c-count" min="1" max="20" step="1" value="' + conductor.count + '" /><span class="ctl-val" id="c-count-val">' + conductor.count + "</span></div>";
  h += '<div class="row mt1"><label class="ctl-label" for="c-trail">Trail</label><input type="range" id="c-trail" min="10" max="140" step="10" value="' + conductor.trail + '" /><span class="ctl-val" id="c-trail-val">' + conductor.trail + "</span></div>";
  h += '<div class="row mt2"><label class="ctl-label" for="c-follow">Follow with</label>';
  h += '<select class="field grow" id="c-follow"><option value="">Just the bob</option>';
  parts.forEach(function (p) {
    h += '<option value="' + esc(p) + '"' + (conductor.follow === p ? " selected" : "") + ">" + esc(p) + "</option>";
  });
  h += "</select></div>";
  h += "</section>";
  el.innerHTML = h;
  document.getElementById("c-playpause").addEventListener("click", function () {
    conductor.playing = !conductor.playing;
    renderConductor();
    conductorStart();
  });
  document.getElementById("c-restart").addEventListener("click", function () {
    conductorReset();
    conductor.playing = true;
    renderConductor();
    conductorStart();
  });
  el.querySelectorAll("[data-pivot]").forEach(function (b) {
    b.addEventListener("click", function () {
      conductor.pivotMode = b.getAttribute("data-pivot");
      conductor.pendulums.forEach(function (p) { p.trail = []; });
      renderConductor();
      conductorStart();
    });
  });
  document.getElementById("c-speed").addEventListener("input", function (e) {
    conductor.speed = Number(e.target.value);
    document.getElementById("c-speed-val").textContent = conductor.speed.toFixed(1) + "x";
  });
  document.getElementById("c-chaos").addEventListener("input", function (e) {
    conductor.chaos = Number(e.target.value);
    document.getElementById("c-chaos-val").textContent = conductor.chaos;
    conductorReset();
  });
  document.getElementById("c-count").addEventListener("input", function (e) {
    conductor.count = Number(e.target.value);
    document.getElementById("c-count-val").textContent = conductor.count;
    conductorReset();
  });
  document.getElementById("c-trail").addEventListener("input", function (e) {
    conductor.trail = Number(e.target.value);
    document.getElementById("c-trail-val").textContent = conductor.trail;
  });
  document.getElementById("c-follow").addEventListener("change", function (e) {
    conductor.follow = e.target.value;
    document.getElementById("c-follow-label").textContent = conductor.follow ? "Follow the yellow bob with your " + conductor.follow : "Follow the yellow bob";
  });
}
function conductorPivotTarget(w, hgt) {
  var cx = w / 2, cy = hgt / 2;
  if (conductor.pivotMode === "circle") {
    var R = Math.min(w, hgt) * 0.22;
    return { x: cx + R * Math.cos(conductor.t * 0.4), y: cy + R * Math.sin(conductor.t * 0.4) };
  }
  if (conductor.pivotMode === "3d") {
    return { x: cx + w * 0.17 * Math.sin(conductor.t * 0.26), y: cy + hgt * 0.13 * Math.sin(conductor.t * 0.34 + 1.2) };
  }
  /* grid: hop cell to cell on the 4x3 grid */
  var col = conductor.gridIdx % 4;
  var row = Math.floor(conductor.gridIdx / 4) % 3;
  return { x: (col + 0.5) * (w / 4), y: (row + 0.5) * (hgt / 3) };
}
function conductorFrame(ts) {
  conductor.raf = null;
  if (state.tab !== "conductor") return;
  var canvas = document.getElementById("conductor-canvas");
  if (!canvas) return;
  var w = canvas.clientWidth, hgt = canvas.clientHeight;
  if (w === 0 || hgt === 0) { conductorStart(); return; }
  if (canvas.width !== w || canvas.height !== hgt) { canvas.width = w; canvas.height = hgt; }
  var ctx = canvas.getContext("2d");
  if (!ctx) return;
  var dtMs = conductor.lastTs ? Math.min(64, ts - conductor.lastTs) : 16;
  conductor.lastTs = ts;
  var dt = dtMs / 1000;

  if (conductor.playing) {
    conductor.t += dt;
    if (conductor.pivotMode === "grid") {
      conductor.gridTimer += dt;
      if (conductor.gridTimer > 2.8) {
        conductor.gridTimer = 0;
        conductor.gridIdx = (conductor.gridIdx + 1) % 12;
        conductor.pendulums.forEach(function (p) { p.trail = []; });
      }
    }
    var simDt = 0.016 * conductor.speed;
    var steps = Math.max(1, Math.round(conductor.speed * 2));
    conductor.pendulums.forEach(function (p) {
      for (var k = 0; k < steps; k++) pendulumStep(p, simDt / steps);
    });
  }
  var target = conductorPivotTarget(w, hgt);
  if (conductor.pivot.x === 0 && conductor.pivot.y === 0) { conductor.pivot.x = target.x; conductor.pivot.y = target.y; }
  var lerp = conductor.pivotMode === "grid" ? 0.045 : 1;
  conductor.pivot.x += (target.x - conductor.pivot.x) * lerp;
  conductor.pivot.y += (target.y - conductor.pivot.y) * lerp;
  var px = conductor.pivot.x, py = conductor.pivot.y;
  var L = Math.min(w, hgt) * 0.20;
  var phi = conductor.pivotMode === "3d" ? conductor.t * 0.3 : 0;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, hgt);
  /* pivot path guides */
  ctx.strokeStyle = "rgba(164,156,174,0.28)";
  ctx.lineWidth = 1;
  if (conductor.pivotMode === "grid") {
    ctx.beginPath();
    for (var gx = 1; gx < 4; gx++) { ctx.moveTo(gx * w / 4, 0); ctx.lineTo(gx * w / 4, hgt); }
    for (var gy = 1; gy < 3; gy++) { ctx.moveTo(0, gy * hgt / 3); ctx.lineTo(w, gy * hgt / 3); }
    ctx.stroke();
    ctx.fillStyle = "rgba(164,156,174,0.4)";
    for (var cx2 = 0; cx2 < 4; cx2++) for (var cy2 = 0; cy2 < 3; cy2++) {
      ctx.beginPath(); ctx.arc((cx2 + 0.5) * w / 4, (cy2 + 0.5) * hgt / 3, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (conductor.pivotMode === "circle") {
    ctx.beginPath();
    ctx.arc(w / 2, hgt / 2, Math.min(w, hgt) * 0.22, 0, Math.PI * 2);
    ctx.stroke();
  }
  function project(x, y) {
    if (conductor.pivotMode !== "3d") return { x: px + x, y: py + y, s: 1 };
    var c = Math.cos(phi), sn = Math.sin(phi);
    return { x: px + x * c, y: py + y - x * sn * 0.38, s: 1 - 0.28 * sn * (x / (L * 2)) };
  }
  conductor.pendulums.forEach(function (p, i) {
    var x1 = L * Math.sin(p.a1), y1 = L * Math.cos(p.a1);
    var x2 = x1 + L * Math.sin(p.a2), y2 = y1 + L * Math.cos(p.a2);
    var b1 = project(x1, y1), b2 = project(x2, y2);
    if (conductor.playing) {
      p.trail.push({ x: b2.x, y: b2.y });
      while (p.trail.length > conductor.trail) p.trail.shift();
    }
    var hue = Math.round((i * 360 / Math.max(1, conductor.pendulums.length) + 160) % 360);
    var color = "hsl(" + hue + ", 85%, 62%)";
    if (p.trail.length > 1) {
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 2;
      ctx.beginPath();
      p.trail.forEach(function (pt, j) { if (j === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = "rgba(245,239,232,0.5)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(b1.x, b1.y, 3.5 * b1.s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(b2.x, b2.y, 5 * b2.s, 0, Math.PI * 2); ctx.fill();
  });
  /* the lead bob: big, yellow, the one to follow */
  var lead = conductor.pendulums[0];
  if (lead) {
    var lx1 = L * Math.sin(lead.a1), ly1 = L * Math.cos(lead.a1);
    var lx2 = lx1 + L * Math.sin(lead.a2), ly2 = ly1 + L * Math.cos(lead.a2);
    var lb = project(lx2, ly2);
    ctx.fillStyle = "#ffd23f";
    ctx.beginPath(); ctx.arc(lb.x, lb.y, 13 * lb.s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,210,63,0.45)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(lb.x, lb.y, 19 * lb.s, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.fillStyle = "#f5efe8";
  ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();

}
function conductorStart() {
  if (state.tab !== "conductor") return;

}
function conductorStop() {
  if (conductor.raf !== null) { cancelAnimationFrame(conductor.raf); conductor.raf = null; }

}
